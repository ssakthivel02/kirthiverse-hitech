name: Class 6 Maths Pilot QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/class6-math-*.js'
      - 'docs/class6-pilot/**'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - 'tests/class6-math-pilot.test.mjs'
      - 'tests/class6-math-ch2.test.mjs'
      - 'tests/class6-math-ch3.test.mjs'
      - 'tests/class6-math-ch4.test.mjs'
      - 'tests/class6-math-ch5.test.mjs'
      - 'tests/class6-math-ch6.test.mjs'
      - 'tests/class6-math-ch7.test.mjs'
      - 'tests/class6-math-ch8.test.mjs'
      - 'tests/class6-math-ch9.test.mjs'
      - 'tests/class6-math-school-needs.test.mjs'
      - 'tests/class6-math-ch2-school-needs.test.mjs'
      - 'tests/class6-math-ch3-school-needs.test.mjs'
      - 'tests/class6-math-ch4-school-needs.test.mjs'
      - 'tests/class6-math-ch5-school-needs.test.mjs'
      - 'tests/class6-math-ch6-school-needs.test.mjs'
      - 'tests/class6-math-ch7-school-needs.test.mjs'
      - 'tests/class6-math-ch8-school-needs.test.mjs'
      - 'tests/class6-coverage-reconciliation.test.mjs'
      - 'tests/e2e/release-closure.spec.mjs'
      - '.github/workflows/class6-math-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class6-math-pilot:
    name: class6-math-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Class 6 Mathematics Chapter 1 curriculum contract
        run: node tests/class6-math-pilot.test.mjs
      - name: Validate Chapter 1 synthetic school-learning needs coverage
        run: node tests/class6-math-school-needs.test.mjs
      - name: Validate Class 6 Mathematics Chapter 2 teaching slice
        run: node tests/class6-math-ch2.test.mjs
      - name: Validate Chapter 2 synthetic school-learning needs coverage
        run: node tests/class6-math-ch2-school-needs.test.mjs
      - name: Validate Class 6 Mathematics Chapter 3 teaching slice
        run: node tests/class6-math-ch3.test.mjs
      - name: Validate Chapter 3 synthetic school-learning needs coverage
        run: node tests/class6-math-ch3-school-needs.test.mjs
      - name: Validate Class 6 Mathematics Chapter 4 teaching slice
        run: node tests/class6-math-ch4.test.mjs
      - name: Validate Chapter 4 synthetic school-learning needs coverage
        run: node tests/class6-math-ch4-school-needs.test.mjs
      - name: Validate Class 6 Mathematics Chapter 5 teaching slice
        run: node tests/class6-math-ch5.test.mjs
      - name: Validate Chapter 5 synthetic school-learning needs coverage
        run: node tests/class6-math-ch5-school-needs.test.mjs
      - name: Validate Class 6 Mathematics Chapter 6 teaching slice
        run: node tests/class6-math-ch6.test.mjs
      - name: Validate Chapter 6 synthetic school-learning needs coverage
        run: node tests/class6-math-ch6-school-needs.test.mjs
      - name: Validate Class 6 Mathematics Chapter 7 teaching slice
        run: node tests/class6-math-ch7.test.mjs
      - name: Validate Chapter 7 synthetic school-learning needs coverage
        run: node tests/class6-math-ch7-school-needs.test.mjs
      - name: Validate Class 6 Mathematics Chapter 8 teaching slice
        run: node tests/class6-math-ch8.test.mjs
      - name: Validate Chapter 8 synthetic school-learning needs coverage
        run: node tests/class6-math-ch8-school-needs.test.mjs
      - name: Validate Class 6 Mathematics Chapter 9 teaching slice
        run: node tests/class6-math-ch9.test.mjs
      - name: Validate reconciled Class 6 coverage decision
        run: node tests/class6-coverage-reconciliation.test.mjs
      - name: QA summary
        if: always()
        run: |
          echo '### Class 6 Mathematics Pilot QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- CBSE Class 6 Ganita Prakash 10-chapter mapping contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapters 1-9: twenty-seven KirthiVerse-original Kiki lessons / 135 linked assessments' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapters 1-8 retain separate eight-scenario synthetic school-learning-needs validation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 9 covers line/reflection symmetry, exact reflected point placement, generating multi-axis symmetric figures, and rotational symmetry/order/angle' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 9 runtime reuses the existing Chapter 1 data request; Chapter 8 reuses Chapter 2; Chapters 3-7 remain in their approved consolidated runtime, preserving the startup request ceiling' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mathematics assessment loading remains deferred on bounded Class 6 lesson/practice/diagnostic/release-closure surfaces' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 9 school-needs validation remains the separate next evidence task; Chapter 10 content is not created here' >> "$GITHUB_STEP_SUMMARY"
          echo '- privacy boundary: no real child data, photos, microphone, camera, recording, precise location, remote monitoring or child-facing cloud AI' >> "$GITHUB_STEP_SUMMARY"
          echo '- school overlay is validation context only; no school-specific pacing, efficacy or attainment claim' >> "$GITHUB_STEP_SUMMARY"
          echo '- active PWA v45 cache generation is retained; Chapter 9 assessment asset is additive only' >> "$GITHUB_STEP_SUMMARY"
          echo '- canonical Kiki wording and no-microphone/no-recording safety assertions retained' >> "$GITHUB_STEP_SUMMARY"
