name: Class 6 Maths Pilot QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/class6-math-*.js'
      - 'docs/class6-pilot/**'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - 'tests/class6-math-pilot.test.mjs'
      - 'tests/class6-math-ch2.test.mjs'
      - 'tests/class6-math-school-needs.test.mjs'
      - 'tests/class6-coverage-reconciliation.test.mjs'
      - 'tests/e2e/release-closure.spec.mjs'
      - '.github/workflows/class6-math-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class6-math-pilot:
    name: class6-math-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Class 6 Mathematics Chapter 1 curriculum contract
        run: node tests/class6-math-pilot.test.mjs
      - name: Validate Chapter 1 synthetic school-learning needs coverage
        run: node tests/class6-math-school-needs.test.mjs
      - name: Validate Class 6 Mathematics Chapter 2 teaching slice
        run: node tests/class6-math-ch2.test.mjs
      - name: Validate reconciled Class 6 coverage decision
        run: node tests/class6-coverage-reconciliation.test.mjs
      - name: QA summary
        if: always()
        run: |
          echo '### Class 6 Mathematics Pilot QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- CBSE Class 6 Ganita Prakash 10-chapter mapping contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapters 1-2: six KirthiVerse-original Kiki lessons / 30 linked assessments' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 1 retains eight-scenario synthetic school-learning-needs validation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 2 covers geometry primitives, angle comparison/classification, and protractor measurement/construction' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 2 assessment loading is lazy outside release-closure while lesson discovery remains immediate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 2 school-needs validation remains a separate next evidence task; it is not fabricated by this runtime PR' >> "$GITHUB_STEP_SUMMARY"
          echo '- privacy boundary: no real child data, photos, microphone, camera, recording, remote monitoring or child-facing cloud AI' >> "$GITHUB_STEP_SUMMARY"
          echo '- school overlay is validation context only; no school-specific pacing or efficacy claim' >> "$GITHUB_STEP_SUMMARY"
          echo '- fail-closed add-on loading, offline precache and release regression coverage retained' >> "$GITHUB_STEP_SUMMARY"
          echo '- canonical Kiki wording and no-microphone/no-recording safety assertions retained' >> "$GITHUB_STEP_SUMMARY"
