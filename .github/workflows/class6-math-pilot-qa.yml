name: Class 6 Maths Pilot QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/class6-math-*.js'
      - 'docs/class6-pilot/**'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - 'tests/class6-math-pilot.test.mjs'
      - 'tests/class6-math-school-needs.test.mjs'
      - '.github/workflows/class6-math-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class6-math-pilot:
    name: class6-math-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Class 6 Mathematics curriculum contract
        run: node tests/class6-math-pilot.test.mjs
      - name: Validate synthetic school-learning needs coverage
        run: node tests/class6-math-school-needs.test.mjs
      - name: QA summary
        if: always()
        run: |
          echo '### Class 6 Mathematics Pilot QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- CBSE Class 6 Ganita Prakash 10-chapter mapping contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 1 three-topic KirthiVerse-original teaching integrity' >> "$GITHUB_STEP_SUMMARY"
          echo '- 15 linked assessment records including reasoning and mastery' >> "$GITHUB_STEP_SUMMARY"
          echo '- eight synthetic school-learning needs scenarios across all Chapter 1 topics' >> "$GITHUB_STEP_SUMMARY"
          echo '- deterministic mapping from need → Kiki misconception/remediation → assessment → mastery evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '- privacy boundary: no real child data, photos, microphone, camera, recording, remote monitoring or child-facing cloud AI' >> "$GITHUB_STEP_SUMMARY"
          echo '- synthetic readiness evidence only; no live school pilot or efficacy claim' >> "$GITHUB_STEP_SUMMARY"
          echo '- fail-closed add-on loading and offline precache coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '- canonical Kiki wording and no-microphone/no-recording safety assertions' >> "$GITHUB_STEP_SUMMARY"
