name: Class 6 Science Pilot QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/class6-science-*.js'
      - 'docs/class6-pilot/SCIENCE_CURIOSITY_MAP_V1.json'
      - 'docs/class6-pilot/SCIENCE_CH1_SCHOOL_NEEDS_VALIDATION_V1.json'
      - 'docs/class6-pilot/SCIENCE_CH2_SCHOOL_NEEDS_VALIDATION_V1.json'
      - 'docs/class6-pilot/SCIENCE_CH3_SCHOOL_NEEDS_VALIDATION_V1.json'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - 'tests/class6-science-pilot.test.mjs'
      - 'tests/class6-science-school-needs.test.mjs'
      - 'tests/class6-science-ch2.test.mjs'
      - 'tests/class6-science-ch2-school-needs.test.mjs'
      - 'tests/class6-science-ch3.test.mjs'
      - 'tests/class6-science-ch3-school-needs.test.mjs'
      - 'tests/class6-science-ch4.test.mjs'
      - 'tests/e2e/release-closure.spec.mjs'
      - '.github/workflows/class6-science-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class6-science-pilot:
    name: class6-science-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Class 6 Science Chapter 1 contract
        run: node tests/class6-science-pilot.test.mjs
      - name: Validate Chapter 1 synthetic school-learning needs coverage
        run: node tests/class6-science-school-needs.test.mjs
      - name: Validate Class 6 Science Chapter 2 contract
        run: node tests/class6-science-ch2.test.mjs
      - name: Validate Chapter 2 synthetic school-learning needs coverage
        run: node tests/class6-science-ch2-school-needs.test.mjs
      - name: Validate Class 6 Science Chapter 3 contract and child nutrition safety boundary
        run: node tests/class6-science-ch3.test.mjs
      - name: Validate Chapter 3 synthetic school-learning needs and medical-safety boundary
        run: node tests/class6-science-ch3-school-needs.test.mjs
      - name: Validate Class 6 Science Chapter 4 magnet evidence and safety boundary
        run: node tests/class6-science-ch4.test.mjs
      - name: QA summary
        if: always()
        run: |
          echo '### Class 6 Science Pilot QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- NCERT Curiosity 2026-27 12-chapter map' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapters 1-4: twelve Kiki teaching topics / twelve lessons' >> "$GITHUB_STEP_SUMMARY"
          echo '- 60 independently authored assessments including reasoning and mastery' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapters 1-3 retain eight-scenario synthetic school-needs validation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 4: magnetic-material evidence, poles/attraction/repulsion, compass direction/interference' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 4 rejects all-metals-are-magnetic and attraction-alone-proves-a-magnet misconceptions' >> "$GITHUB_STEP_SUMMARY"
          echo '- magnet safety: no ingestion or mouth/nose/ear placement, no electronics dismantling, no loose high-powered magnets' >> "$GITHUB_STEP_SUMMARY"
          echo '- privacy boundary: no real child data, microphone, camera, recording, remote monitoring or child-facing cloud AI' >> "$GITHUB_STEP_SUMMARY"
          echo '- additive local-first loader and offline precache coverage required' >> "$GITHUB_STEP_SUMMARY"
          echo '- no claim that Science is complete beyond Chapters 1-4' >> "$GITHUB_STEP_SUMMARY"
