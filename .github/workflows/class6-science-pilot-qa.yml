name: Class 6 Science Pilot QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/class6-science-*.js'
      - 'docs/class6-pilot/SCIENCE_CURIOSITY_MAP_V1.json'
      - 'docs/class6-pilot/SCIENCE_CH1_SCHOOL_NEEDS_VALIDATION_V1.json'
      - 'docs/class6-pilot/SCIENCE_CH2_SCHOOL_NEEDS_VALIDATION_V1.json'
      - 'docs/class6-pilot/SCIENCE_CH3_SCHOOL_NEEDS_VALIDATION_V1.json'
      - 'docs/class6-pilot/SCIENCE_CH4_SCHOOL_NEEDS_VALIDATION_V1.json'
      - 'docs/class6-pilot/SCIENCE_CH5_SCHOOL_NEEDS_VALIDATION_V1.json'
      - 'docs/class6-pilot/SCIENCE_CH6_SCHOOL_NEEDS_VALIDATION_V1.json'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - 'tests/class6-science-pilot.test.mjs'
      - 'tests/class6-science-school-needs.test.mjs'
      - 'tests/class6-science-ch2.test.mjs'
      - 'tests/class6-science-ch2-school-needs.test.mjs'
      - 'tests/class6-science-ch3.test.mjs'
      - 'tests/class6-science-ch3-school-needs.test.mjs'
      - 'tests/class6-science-ch4.test.mjs'
      - 'tests/class6-science-ch4-school-needs.test.mjs'
      - 'tests/class6-science-ch5.test.mjs'
      - 'tests/class6-science-ch5-school-needs.test.mjs'
      - 'tests/class6-science-ch6.test.mjs'
      - 'tests/class6-science-ch6-school-needs.test.mjs'
      - 'tests/e2e/release-closure.spec.mjs'
      - '.github/workflows/class6-science-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class6-science-pilot:
    name: class6-science-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Class 6 Science Chapter 1 contract
        run: node tests/class6-science-pilot.test.mjs
      - name: Validate Chapter 1 synthetic school-learning needs coverage
        run: node tests/class6-science-school-needs.test.mjs
      - name: Validate Class 6 Science Chapter 2 contract
        run: node tests/class6-science-ch2.test.mjs
      - name: Validate Chapter 2 synthetic school-learning needs coverage
        run: node tests/class6-science-ch2-school-needs.test.mjs
      - name: Validate Class 6 Science Chapter 3 contract and child nutrition safety boundary
        run: node tests/class6-science-ch3.test.mjs
      - name: Validate Chapter 3 synthetic school-learning needs and medical-safety boundary
        run: node tests/class6-science-ch3-school-needs.test.mjs
      - name: Validate Class 6 Science Chapter 4 magnet evidence and safety boundary
        run: node tests/class6-science-ch4.test.mjs
      - name: Validate Chapter 4 synthetic school-learning needs and magnet-safety boundary
        run: node tests/class6-science-ch4-school-needs.test.mjs
      - name: Validate Class 6 Science Chapter 5 measurement and motion boundary
        run: node tests/class6-science-ch5.test.mjs
      - name: Validate Chapter 5 synthetic school-learning needs and measurement/motion safety boundary
        run: node tests/class6-science-ch5-school-needs.test.mjs
      - name: Validate Class 6 Science Chapter 6 materials properties and safety boundary
        run: node tests/class6-science-ch6.test.mjs
      - name: Validate Chapter 6 synthetic school-learning needs and materials-safety boundary
        run: node tests/class6-science-ch6-school-needs.test.mjs
      - name: QA summary
        if: always()
        run: |
          echo '### Class 6 Science Pilot QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- NCERT Curiosity 2026-27 12-chapter map' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapters 1-6: eighteen Kiki teaching topics / eighteen lessons' >> "$GITHUB_STEP_SUMMARY"
          echo '- 90 independently authored assessments including reasoning and mastery' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapters 1-6 retain eight-scenario synthetic school-needs validation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 6 readiness covers object/material confusion, classification discipline, appearance inference, light transmission, non-destructive hardness, solubility vs float/sink, hazardous-test rejection and offline/privacy-safe practice' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 6 safety rejects tasting, unknown powders/medicines/cleaners/chemicals, destructive sharp-tool tests, broken glass, heat/flame and laser/eye exposure' >> "$GITHUB_STEP_SUMMARY"
          echo '- privacy boundary: no real child data, microphone, camera, recording, remote monitoring or child-facing cloud AI' >> "$GITHUB_STEP_SUMMARY"
          echo '- additive local-first loader and PWA v39 offline precache coverage remain unchanged' >> "$GITHUB_STEP_SUMMARY"
          echo '- synthetic readiness only; no live school pilot, efficacy, attainment or safety-certification claim' >> "$GITHUB_STEP_SUMMARY"
          echo '- no claim that Science is complete beyond Chapters 1-6' >> "$GITHUB_STEP_SUMMARY"
