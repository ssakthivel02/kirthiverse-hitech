name: Class 6 Social Science Pilot QA

on:
  pull_request:
    paths:
      - 'data/class6-social-science-*.js'
      - 'docs/class6-pilot/SOCIAL_SCIENCE_*.json'
      - 'docs/class6-pilot/CLASS6_COVERAGE_MANIFEST_V1.json'
      - 'tests/class6-social-science-*.test.mjs'
      - 'tests/class6-coverage-reconciliation.test.mjs'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - '.github/workflows/class6-social-science-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class6-social-science-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Social Science Chapter 1 teaching slice
        run: node tests/class6-social-science-ch1.test.mjs
      - name: Validate Social Science Chapter 1 school-needs evidence
        run: node tests/class6-social-science-ch1-school-needs.test.mjs
      - name: Validate Social Science Chapter 2 source and topic boundary
        run: node tests/class6-social-science-ch2-reconciliation.test.mjs
      - name: Validate Social Science Chapter 2 teaching slice
        run: node tests/class6-social-science-ch2.test.mjs
      - name: Validate Social Science Chapter 2 school-needs evidence
        run: node tests/class6-social-science-ch2-school-needs.test.mjs
      - name: Validate Social Science Chapter 3 source and topic boundary
        run: node tests/class6-social-science-ch3-reconciliation.test.mjs
      - name: Validate Social Science Chapter 3 teaching slice
        run: node tests/class6-social-science-ch3.test.mjs
      - name: Validate Social Science Chapter 3 school-needs evidence
        run: node tests/class6-social-science-ch3-school-needs.test.mjs
      - name: Validate Social Science Chapter 4 source and topic boundary
        run: node tests/class6-social-science-ch4-reconciliation.test.mjs
      - name: Validate Social Science Chapter 4 teaching slice
        run: node tests/class6-social-science-ch4.test.mjs
      - name: Validate Social Science Chapter 4 school-needs evidence
        run: node tests/class6-social-science-ch4-school-needs.test.mjs
      - name: Validate Social Science Chapter 5 source and topic boundary
        run: node tests/class6-social-science-ch5-reconciliation.test.mjs
      - name: Validate Social Science Chapter 5 teaching slice
        run: node tests/class6-social-science-ch5.test.mjs
      - name: Validate Social Science Chapter 5 school-needs evidence
        run: node tests/class6-social-science-ch5-school-needs.test.mjs
      - name: Validate Social Science Chapter 6 source and topic boundary
        run: node tests/class6-social-science-ch6-reconciliation.test.mjs
      - name: Validate Social Science Chapter 6 teaching slice
        run: node tests/class6-social-science-ch6.test.mjs
      - name: Validate Class 6 coverage transition
        run: node tests/class6-coverage-reconciliation.test.mjs
      - name: QA summary
        if: always()
        run: |
          echo '## Class 6 Social Science' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 1: 3 Kiki lessons, 15 deterministic assessments, 8 synthetic school-needs scenarios' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 2: 4 Kiki lessons, 20 deterministic assessments, 8 synthetic school-needs scenarios' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 3: 4 Kiki lessons, 20 deterministic assessments, 8 synthetic school-needs scenarios' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 4: 4 Kiki lessons, 20 deterministic assessments, 8 synthetic school-needs scenarios' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 5: 4 Kiki lessons, 20 deterministic assessments, 8 synthetic school-needs scenarios' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 6: 4 Kiki lessons, 20 deterministic assessments; separate school-needs validation remains pending' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapters 1-5 are independently implemented and separately synthetic school-needs validated; Chapter 6 teaching is implemented only' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 6 preserves archaeology uncertainty, undeciphered-script limits, non-superiority framing and no modern identity projection' >> "$GITHUB_STEP_SUMMARY"
          echo '- NCERT remains canonical source authority; textbook prose, exercises, archaeological extracts, maps, site plans, figures and photographs are not copied' >> "$GITHUB_STEP_SUMMARY"
          echo '- existing deferred Social Science loader is reused; no home startup request was introduced' >> "$GITHUB_STEP_SUMMARY"
          echo '- Social Science and whole Class 6 remain incomplete' >> "$GITHUB_STEP_SUMMARY"
          echo '- next bounded task requires fresh concurrency check before Chapter 6 school-needs validation' >> "$GITHUB_STEP_SUMMARY"
