name: Class 6 Social Science Pilot QA

on:
  pull_request:
    paths:
      - 'data/class6-social-science-*.js'
      - 'docs/class6-pilot/SOCIAL_SCIENCE_*.json'
      - 'docs/class6-pilot/CLASS6_COVERAGE_MANIFEST_V1.json'
      - 'tests/class6-social-science-*.test.mjs'
      - 'tests/class6-coverage-reconciliation.test.mjs'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - '.github/workflows/class6-social-science-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class6-social-science-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Social Science Chapter 1 teaching slice
        run: node tests/class6-social-science-ch1.test.mjs
      - name: Validate Social Science Chapter 1 school-needs evidence
        run: node tests/class6-social-science-ch1-school-needs.test.mjs
      - name: Validate Social Science Chapter 2 source and topic boundary
        run: node tests/class6-social-science-ch2-reconciliation.test.mjs
      - name: Validate Class 6 coverage transition
        run: node tests/class6-coverage-reconciliation.test.mjs
      - name: QA summary
        if: always()
        run: |
          echo '## Class 6 Social Science' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 1: 3 independently authored Kiki lessons, 15 deterministic assessments, 8 synthetic school-needs scenarios' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 2: source/topic boundary reconciled across 4 independently authorable topics; no teaching content yet' >> "$GITHUB_STEP_SUMMARY"
          echo '- NCERT remains canonical source authority; textbook prose, exercises, maps and figures are not copied' >> "$GITHUB_STEP_SUMMARY"
          echo '- privacy-safe boundary: no real child data, live location, camera, microphone or child-facing cloud AI' >> "$GITHUB_STEP_SUMMARY"
          echo '- SAN Academy remains validation context only; no live-school, efficacy, attainment or pacing claim' >> "$GITHUB_STEP_SUMMARY"
          echo '- Social Science and whole Class 6 remain incomplete' >> "$GITHUB_STEP_SUMMARY"
          echo '- next bounded task requires fresh concurrency check before Chapter 2 Kiki teaching implementation' >> "$GITHUB_STEP_SUMMARY"
