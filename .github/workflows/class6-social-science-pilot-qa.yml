name: Class 6 Social Science Pilot QA

on:
  pull_request:
    paths:
      - 'data/class6-social-science-*.js'
      - 'docs/class6-pilot/SOCIAL_SCIENCE_*.json'
      - 'docs/class6-pilot/CLASS6_COVERAGE_MANIFEST_V1.json'
      - 'tests/class6-social-science-*.test.mjs'
      - 'tests/class6-coverage-reconciliation.test.mjs'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - '.github/workflows/class6-social-science-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class6-social-science-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Social Science Chapter 1 teaching slice
        run: node tests/class6-social-science-ch1.test.mjs
      - name: Validate Class 6 coverage transition
        run: node tests/class6-coverage-reconciliation.test.mjs
      - name: QA summary
        if: always()
        run: |
          echo '## Class 6 Social Science Chapter 1' >> "$GITHUB_STEP_SUMMARY"
          echo '- 3 independently authored Kiki lessons' >> "$GITHUB_STEP_SUMMARY"
          echo '- 15 deterministic assessments' >> "$GITHUB_STEP_SUMMARY"
          echo '- route-deferred runtime loading; no new home-startup request' >> "$GITHUB_STEP_SUMMARY"
          echo '- offline precache includes lesson and assessment datasets' >> "$GITHUB_STEP_SUMMARY"
          echo '- SAN Academy remains validation context only; no live-school or pacing claim' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chapter 1 school-needs validation remains a separate next gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- no Social Science or whole-Class-6 completion claim' >> "$GITHUB_STEP_SUMMARY"
