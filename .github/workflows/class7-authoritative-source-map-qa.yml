name: KirthiVerse Class 7 Authoritative Source Map QA
on:
  pull_request:
    paths:
      - 'data/class7-authoritative-source-map-v1.js'
      - 'scripts/validate-class7-authoritative-source-map.mjs'
      - '.github/workflows/class7-authoritative-source-map-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate authoritative source registry
        run: |
          set -euo pipefail
          node --check data/class7-authoritative-source-map-v1.js
          node --check scripts/validate-class7-authoritative-source-map.mjs
          node scripts/validate-class7-authoritative-source-map.mjs
      - name: Enforce source-before-authoring policy
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{}};vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/class7-authoritative-source-map-v1.js','utf8'),sandbox);
          const s=sandbox.window.KV_CLASS7_AUTHORITATIVE_SOURCE_MAP;
          const pending=Object.entries(s.subjects).filter(([,v])=>v.state==='SOURCE_VERIFIED_UNIT_MAP_PENDING').map(([k])=>k);
          if(!pending.includes('Social Science'))throw Error('Social Science must remain blocked until its direct official unit map is verified');
          for(const subject of ['Mathematics','Science'])if(s.subjects[subject].state!=='SOURCE_VERIFIED_UNIT_MAP_COMPLETE')throw Error(`${subject} verified unit-map state missing`);
          console.log('CLASS7_SOURCE_BEFORE_AUTHORING_POLICY_PASS');
          NODE
