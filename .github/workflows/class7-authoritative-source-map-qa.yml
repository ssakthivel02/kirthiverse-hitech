name: KirthiVerse Class 7 Authoritative Source Map QA
on:
  pull_request:
    paths:
      - 'data/class7-authoritative-source-map-v1.js'
      - 'scripts/validate-class7-authoritative-source-map.mjs'
      - '.github/workflows/class7-authoritative-source-map-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate authoritative source registry
        run: |
          set -euo pipefail
          node --check data/class7-authoritative-source-map-v1.js
          node --check scripts/validate-class7-authoritative-source-map.mjs
          node scripts/validate-class7-authoritative-source-map.mjs
      - name: Keep lesson authoring blocked
        run: |
          set -euo pipefail
          count="$(find data -maxdepth 1 -type f -name 'class7-*' ! -name 'class7-curriculum-manifest-v1.js' ! -name 'class7-authoritative-source-map-v1.js' | wc -l)"
          test "$count" -eq 0
          echo 'CLASS7_SOURCE_MAP_NO_PREMATURE_LESSONS_PASS'