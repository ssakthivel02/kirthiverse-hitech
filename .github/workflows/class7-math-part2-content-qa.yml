name: Class 7 Mathematics Part II Content QA
on:
  pull_request:
    paths:
      - 'data/class7-math-part2-*.js'
      - 'class7-math-runtime-v1.js'
      - 'lesson-check-v1.js'
      - 'scripts/verify-class7-math-part2.mjs'
      - '.github/workflows/class7-math-part2-content-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  part2-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate syntax and Part II contract
        run: |
          set -euo pipefail
          node --check data/class7-math-part2-unit-map-v1.js
          node --check data/class7-math-part2-lessons.js
          node --check data/class7-math-part2-assessments.js
          node --check class7-math-runtime-v1.js
          node --check lesson-check-v1.js
          node --check scripts/verify-class7-math-part2.mjs
          node scripts/verify-class7-math-part2.mjs
          node scripts/verify-class7-math-runtime-factory.mjs
          node scripts/verify-class7-math-completion-batch.mjs
      - name: Guard original-content boundary
        run: |
          set -euo pipefail
          grep -q 'KirthiVerse-original' data/class7-math-part2-lessons.js
          grep -q 'KirthiVerse-original' data/class7-math-part2-assessments.js
          grep -q 'KIRTHIVERSE_ORIGINAL_NO_TEXTBOOK_EXERCISE_REPRODUCTION' data/class7-math-part2-lessons.js
          grep -q 'textbookProseCopied:false' data/class7-math-part2-unit-map-v1.js
          grep -q 'textbookExercisesCopied:false' data/class7-math-part2-unit-map-v1.js
          echo 'CLASS7_MATH_PART2_ORIGINAL_CONTENT_BOUNDARY_PASS'
