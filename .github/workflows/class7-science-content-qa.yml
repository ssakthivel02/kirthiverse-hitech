name: KirthiVerse Class 7 Science Content QA
on:
  pull_request:
    paths:
      - 'data/class7-science-*-lessons.js'
      - 'data/class7-science-*-assessments.js'
      - 'scripts/validate-class7-science-*.mjs'
      - '.github/workflows/class7-science-content-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  science-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and corpus contract
        run: |
          set -euo pipefail
          node --check data/class7-science-ch2-5-lessons.js
          node --check data/class7-science-ch2-5-assessments.js
          node --check scripts/validate-class7-science-ch2-5.mjs
          node scripts/validate-class7-science-ch2-5.mjs
