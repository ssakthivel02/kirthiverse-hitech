name: Class 8 Social Science Part 2 Content QA
on:
  pull_request:
    paths:
      - 'data/class8-social-science-part2-*.js'
      - 'class8-social-science-runtime-v1.js'
      - 'lesson-check-v1.js'
      - 'scripts/verify-class8-social-science-part2.mjs'
      - '.github/workflows/class8-social-science-part2-content-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  class8-social-science-part2-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate syntax and Part 2 contract
        run: |
          set -euo pipefail
          node --check data/class8-social-science-part2-unit-map-v1.js
          node --check data/class8-social-science-part2-lessons.js
          node --check data/class8-social-science-part2-assessments.js
          node --check class8-social-science-runtime-v1.js
          node --check lesson-check-v1.js
          node --check scripts/verify-class8-social-science-part2.mjs
          node scripts/verify-class8-social-science-part2.mjs
          node scripts/verify-class8-social-science-part1.mjs
      - name: Guard original-content boundary
        run: |
          set -euo pipefail
          grep -q 'KirthiVerse-original' data/class8-social-science-part2-lessons.js
          grep -q 'KirthiVerse-original' data/class8-social-science-part2-assessments.js
          grep -q 'KIRTHIVERSE_ORIGINAL_NO_TEXTBOOK_EXERCISE_REPRODUCTION' data/class8-social-science-part2-lessons.js
          grep -q 'textbookProseCopied:false' data/class8-social-science-part2-unit-map-v1.js
          grep -q 'textbookExercisesCopied:false' data/class8-social-science-part2-unit-map-v1.js
          echo 'CLASS8_SOCIAL_SCIENCE_PART2_ORIGINAL_CONTENT_BOUNDARY_PASS'
