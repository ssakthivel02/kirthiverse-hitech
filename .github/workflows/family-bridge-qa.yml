name: KirthiVerse Family Bridge QA
on:
  pull_request:
    paths:
      - 'family.html'
      - 'family-bridge.js'
      - 'family-bridge.css'
      - 'scripts/validate-family-bridge.mjs'
      - '.github/workflows/family-bridge-qa.yml'
  push:
    branches: [feat/family-bridge-v1]
    paths:
      - 'family.html'
      - 'family-bridge.js'
      - 'family-bridge.css'
      - 'scripts/validate-family-bridge.mjs'
      - '.github/workflows/family-bridge-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate synthetic local-only contract
        run: node scripts/validate-family-bridge.mjs
      - name: Headless Chromium guardian prototype QA
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8773 --bind 127.0.0.1 >/tmp/kv-family-http.log 2>&1 &
          spid=$!
          trap 'kill "$spid" 2>/dev/null || true; kill "${cpid:-}" 2>/dev/null || true' EXIT
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9561 --user-data-dir=/tmp/kv-family-profile http://127.0.0.1:8773/family.html >/tmp/kv-family-chrome.log 2>&1 &
          cpid=$!
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:9561/json/list >/tmp/kv-family-pages.json && break || sleep 1; done
          node <<'NODE'
          const pages=await fetch('http://127.0.0.1:9561/json/list').then(r=>r.json());
          const page=pages.find(x=>x.type==='page');if(!page)throw Error('No Chromium page');
          const ws=new WebSocket(page.webSocketDebuggerUrl);await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=bad});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.bad(Error(m.error.message)):p.ok(m.result)}};
          const send=(method,params={})=>new Promise((ok,bad)=>{const id=++seq;pending.set(id,{ok,bad});ws.send(JSON.stringify({id,method,params}))});await send('Runtime.enable');
          const ev=async expression=>{const r=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.text||'eval failed');return r.result?.value};
          const wait=async(expr,label)=>{const end=Date.now()+15000;while(Date.now()<end){try{if(await ev(expr))return}catch{}await new Promise(r=>setTimeout(r,250))}throw Error('Timeout: '+label)};
          await wait(`window.KV_FAMILY_BRIDGE?.syntheticOnly===true&&document.querySelector('[data-open]')`,'family gate');
          if(!(await ev(`document.body.innerText.includes('does not authenticate or verify a guardian')`)))throw Error('Prototype guardian warning missing');
          await ev(`document.querySelector('[data-open]').click();true`);
          await wait(`document.querySelector('#weeklyGoal')&&document.querySelector('[data-share]')`,'family dashboard');
          if(!(await ev(`document.body.innerText.includes('SYNTHETIC DATA ONLY')&&document.body.innerText.includes('No real child name')`)))throw Error('Synthetic/privacy copy missing');
          await ev(`document.getElementById('weeklyGoal').value='7';document.getElementById('weeklyGoal').dispatchEvent(new Event('change',{bubbles:true}));document.getElementById('largeText').click();document.querySelector('[data-share]').click();true`);
          await wait(`JSON.parse(localStorage.getItem('kirthiverse.hitech.family-bridge.demo.v1')).shareActive===true`,'local share preview');
          let s=await ev(`JSON.parse(localStorage.getItem('kirthiverse.hitech.family-bridge.demo.v1'))`);
          if(s.weeklyGoal!==7||s.largeText!==true||!s.shareId)throw Error('Goal/accessibility/share state did not persist');
          if(!(await ev(`document.body.innerText.includes('not uploaded anywhere')`)))throw Error('No-network share disclosure missing');
          await ev(`document.querySelector('[data-revoke]').click();true`);
          await wait(`JSON.parse(localStorage.getItem('kirthiverse.hitech.family-bridge.demo.v1')).shareActive===false`,'share revocation');
          s=await ev(`JSON.parse(localStorage.getItem('kirthiverse.hitech.family-bridge.demo.v1'))`);
          if(s.shareId!==null)throw Error('Share identifier not cleared on revoke');
          await send('Emulation.setDeviceMetricsOverride',{width:390,height:844,deviceScaleFactor:1,mobile:true});
          const mobile=await ev(`({overflow:document.documentElement.scrollWidth-innerWidth,width:innerWidth,grid:getComputedStyle(document.querySelector('.fb-grid')).gridTemplateColumns})`);
          if(mobile.overflow>1)throw Error('390px Family Bridge horizontal overflow: '+JSON.stringify(mobile));
          const a11y=await ev(`(()=>{const a=document.querySelector('.fb-actions a');a.focus();return{focused:document.activeElement===a,h:a.getBoundingClientRect().height}})()`);
          if(!a11y.focused||a11y.h<44)throw Error('Family link keyboard/touch target failure');
          console.log('FAMILY_BRIDGE_BROWSER_PASS: explicit prototype gate, synthetic-only dashboard, local goals/accessibility persistence, no-network share+revoke, 390px mobile, keyboard focus');
          ws.close();
          NODE
      - name: QA summary
        if: always()
        run: |
          echo '### Family Bridge V1 QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- Synthetic-only guardian prototype boundary enforced' >> "$GITHUB_STEP_SUMMARY"
          echo '- Explicit non-authentication warning checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Weekly/focus goals and accessibility controls persist locally' >> "$GITHUB_STEP_SUMMARY"
          echo '- No-network share preview and revoke/identifier clearing checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- 390px mobile containment, keyboard focus and touch target checked' >> "$GITHUB_STEP_SUMMARY"
