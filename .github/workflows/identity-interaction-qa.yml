name: KirthiVerse Identity Interaction QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/identity-interaction-qa.yml'
      - 'ACTIVE_MASTER_CONTROL.json'
      - 'identity/**'
      - 'learner-adaptive-v26.js'
      - 'parent-v1.js'
      - 'educator-pilot-v1.js'
      - 'tests/e2e/identity-governance.spec.mjs'
      - 'playwright.config.mjs'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/identity-interaction-qa.yml'
      - 'ACTIVE_MASTER_CONTROL.json'
      - 'identity/**'
      - 'learner-adaptive-v26.js'
      - 'parent-v1.js'
      - 'educator-pilot-v1.js'
      - 'tests/e2e/identity-governance.spec.mjs'
      - 'playwright.config.mjs'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kirthiverse-identity-interaction-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  identity-interaction:
    name: identity-interaction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup pinned Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Confirm HI-TECH ACTIVE MASTER candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const control=JSON.parse(fs.readFileSync('ACTIVE_MASTER_CONTROL.json','utf8'));
          if(control.status!=='HI-TECH — ACTIVE MASTER')throw new Error('Not HI-TECH ACTIVE MASTER');
          if(control.canonicalRepository!==process.env.GITHUB_REPOSITORY)throw new Error('Canonical repository mismatch');
          if(control.activeBranch!=='main')throw new Error('Active branch must remain main');
          if(process.env.GITHUB_BASE_REF&&process.env.GITHUB_BASE_REF!=='main')throw new Error('PR must target main');
          console.log('IDENTITY_INTERACTION_ACTIVE_MASTER_PASS');
          NODE

      - name: Validate browser spec and identity UI contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/e2e/identity-governance.spec.mjs
          python3 - <<'PY'
          from pathlib import Path
          profile=Path('learner-adaptive-v26.js').read_text(encoding='utf-8')
          parent=Path('parent-v1.js').read_text(encoding='utf-8')
          educator=Path('educator-pilot-v1.js').read_text(encoding='utf-8')
          spec=Path('tests/e2e/identity-governance.spec.mjs').read_text(encoding='utf-8')

          for token in ['data-role-experience="v1"','data-claim-prep="v1"','data-profile-runtime="v26"']:
              assert token in profile, token
          for token in ['Future verified','Future authorised','No upload · no account · no deletion · no silent migration now.']:
              assert token in profile, token
          for token in ['child-deterrent only','not make a 4-digit','verified parental consent','server-side auth']:
              assert token in parent, token
          for token in ['NOT a school account','teacher authentication','local-only']:
              assert token in educator, token

          required_spec=[
            'storageSnapshot','unexpected identity-surface origins','reducedMotion',
            'scrollWidth','pageErrors','Unlock Parent Space first',
            'It is not teacher authentication or a school account.'
          ]
          for token in required_spec:
              assert token in spec, f'identity browser evidence missing: {token}'

          print('IDENTITY_INTERACTION_STATIC_PASS browser_spec=focused current_runtime=true')
          PY

      - name: Install pinned QA dependencies
        run: npm install --no-audit --no-fund

      - name: Install required Playwright engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run desktop Chromium and mobile WebKit identity governance proof
        run: npx playwright test tests/e2e/identity-governance.spec.mjs --project=desktop-chromium --project=mobile-webkit

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kirthiverse-identity-governance-failure-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5

      - name: Identity interaction summary
        if: always()
        run: |
          echo '### KirthiVerse Identity Interaction QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exact HI-TECH ACTIVE MASTER candidate checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Desktop Chromium + mobile WebKit identity-specific browser proof' >> "$GITHUB_STEP_SUMMARY"
          echo '- Five role surfaces and claim-preparation boundary checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Passive role/protection browsing must not mutate local/session identity state' >> "$GITHUB_STEP_SUMMARY"
          echo '- Reduced motion, keyboard focus and horizontal-overflow boundaries checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Identity surfaces may contact only same-origin resources and approved Google font origins' >> "$GITHUB_STEP_SUMMARY"
          echo '- Educator Pilot locked state remains parent-gated local-only, not teacher authentication or a school account' >> "$GITHUB_STEP_SUMMARY"
          echo '- No claim of real authentication, verified consent or production school identity is made' >> "$GITHUB_STEP_SUMMARY"
