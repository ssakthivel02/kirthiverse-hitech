name: KirthiVerse Kiki Mastery World Map QA
on:
  push:
    branches: [feature/kiki-practice-arena-v1]
    paths:
      - '.github/workflows/kiki-mastery-worldmap-qa.yml'
      - 'app.js'
      - 'data/assessments-*.js'
      - 'data/lessons-*.js'
  pull_request:
    paths:
      - 'app.js'
      - 'data/assessments-*.js'
      - 'data/lessons-*.js'
  workflow_dispatch:
permissions:
  contents: read
env:
  LOCAL_URL: http://127.0.0.1:8772
jobs:
  world-map-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5

      - name: Static world-map contract and canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.js').read_text(errors='ignore')
          assessments='\n'.join(p.read_text(errors='ignore') for p in sorted(Path('data').glob('assessments-*.js')))
          lessons='\n'.join(p.read_text(errors='ignore') for p in sorted(Path('data').glob('lessons-*.js')))
          assessment_ids=re.findall(r'"stableAssessmentId"\s*:\s*"([^"]+)"',assessments)
          lesson_ids=re.findall(r'"id"\s*:\s*"([^"]+)"',lessons)
          assert len(assessment_ids)==72 and len(set(assessment_ids))==72
          assert len(lesson_ids)==135 and len(set(lesson_ids))==135
          for marker in ('worldSignalMap','data-world-constellation="v1"','MASTERY CONSTELLATION // 11 WORLDS','EXPLAINABLE WORLD RECOMMENDATION','never automatic mastery scores','not a grade or ranking','No public leaderboard'):
              assert marker in app, f'Missing world-map contract marker: {marker}'
          print('WORLD_MAP_STATIC_PASS: syntax, explainability, child-safety and canonical 135/72 baseline preserved')
          PY

      - name: Headless Chromium world-map interaction and responsive QA
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8772 --bind 127.0.0.1 >/tmp/kv-worldmap-http.log 2>&1 &
          spid=$!
          trap 'kill "$spid" 2>/dev/null || true; kill "${cpid:-}" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS "$LOCAL_URL/index.html" >/tmp/kv-worldmap-index.html && break || sleep 1; done
          rm -rf /tmp/kv-worldmap-profile
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9582 --user-data-dir=/tmp/kv-worldmap-profile "$LOCAL_URL/" >/tmp/kv-worldmap-chrome.log 2>&1 &
          cpid=$!
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:9582/json/list >/tmp/kv-worldmap-pages.json && break || sleep 1; done
          node <<'NODE'
          const pages=await fetch('http://127.0.0.1:9582/json/list').then(r=>r.json()),page=pages.find(x=>x.type==='page');if(!page)throw Error('No page');
          const ws=new WebSocket(page.webSocketDebuggerUrl);await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=bad});
          let seq=0,pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.bad(Error(m.error.message)):p.ok(m.result)}};
          const send=(method,params={})=>new Promise((ok,bad)=>{const id=++seq;pending.set(id,{ok,bad});ws.send(JSON.stringify({id,method,params}))});
          await send('Runtime.enable');await send('Page.enable');
          const ev=async x=>{const r=await send('Runtime.evaluate',{expression:x,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.text||'eval');return r.result?.value};
          const wait=async(x,l)=>{const end=Date.now()+15000;while(Date.now()<end){try{if(await ev(x))return}catch{}await new Promise(r=>setTimeout(r,250))}throw Error('Timeout '+l)};
          await wait(`!!window.KV_NAVIGATION&&window.KV_LESSONS?.length===135&&window.KV_ASSESSMENTS?.length===72`,'runtime + canonical corpus');
          const seed=await ev(`(()=>{const lesson=window.KV_LESSONS.find(x=>x.worldId==='mathematics')||window.KV_LESSONS[0];localStorage.setItem('kirthiverse.hitech.static.progress.v2',JSON.stringify({started:[lesson.id],completed:[],agePath:'all'}));localStorage.setItem('kirthiverse.hitech.mastery.evidence.v1',JSON.stringify({events:[{assessmentId:'qa-local',lessonId:lesson.id,signal:'revisit',recordedAt:Date.now(),source:'practice-self-report'}],lessons:{[lesson.id]:{secure:0,revisit:2,lastSignal:'revisit',lastAt:Date.now(),assessmentIds:['qa-local']}}}));window.KV_NAVIGATION.navigate('/progress');return {id:lesson.id}})()`);
          await wait(`!!document.querySelector('[data-world-constellation="v1"]')`,'world constellation');
          const map=await ev(`(()=>{const root=document.querySelector('[data-world-constellation="v1"]');return {count:Number(root.querySelector('[data-world-signal-count]')?.dataset.worldSignalCount||0),rows:root.querySelectorAll('.world-row').length,text:root.innerText,recommend:root.querySelector('.mission-v2 a.primary')?.getAttribute('href')||''}})()`);
          if(map.count!==11||map.rows!==11)throw Error('Expected exactly 11 world signal rows: '+JSON.stringify(map));
          if(!/EXPLAINABLE WORLD RECOMMENDATION/i.test(map.text)||!/because/i.test(map.text)||!/not a grade or ranking/i.test(map.text))throw Error('Explainable recommendation copy missing');
          if(!/self-reported Practice Arena signals/i.test(map.text)||!/never automatic mastery scores/i.test(map.text))throw Error('Evidence limitation copy missing');
          if(!map.recommend.startsWith('/world/'))throw Error('Recommendation does not link to canonical world');
          if(!/No public leaderboard/i.test(map.text)||!/no comparison with other children/i.test(map.text))throw Error('Child-safety comparison boundary missing');

          for(const [w,h] of [[1440,900],[768,1024],[390,844],[320,800]]){
            await send('Emulation.setDeviceMetricsOverride',{width:w,height:h,deviceScaleFactor:1,mobile:w<760});
            await ev(`window.KV_NAVIGATION.navigate('/progress');true`);
            await wait(`!!document.querySelector('[data-world-constellation="v1"]')`,'progress '+w+'x'+h);
            const check=await ev(`({overflow:document.documentElement.scrollWidth-innerWidth,rows:document.querySelectorAll('[data-world-constellation="v1"] .world-row').length})`);
            if(check.overflow>2)throw Error('Horizontal overflow at '+w+'x'+h+': '+check.overflow);
            if(check.rows!==11)throw Error('World-row count changed at '+w+'x'+h+': '+check.rows);
          }
          await ev(`window.KV_NAVIGATION.navigate('/practice');true`);
          await wait(`document.body.innerText.toLowerCase().includes('kiki practice arena')`,'practice regression');
          await send('Emulation.setEmulatedMedia',{features:[{name:'prefers-reduced-motion',value:'reduce'}]});
          if(!await ev(`matchMedia('(prefers-reduced-motion: reduce)').matches`))throw Error('Reduced-motion preference not active');
          console.log('WORLD_MAP_BROWSER_PASS: 11-world map, transparent recommendation, practice regression, responsive overflow and reduced motion passed');
          ws.close();
          NODE

      - name: QA summary
        if: always()
        run: |
          echo '### KVS-MASTERY-002 — 11-world constellation QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- 135 canonical lessons / 72 canonical assessments preserved' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exactly 11 world signal rows checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Explored/completed + self-reported secure/revisit semantics checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Explainable recommendation reason and canonical world link checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- No automatic mastery, public ranking or child comparison checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Practice Arena regression checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Responsive overflow and reduced motion checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production custom-domain HOLD remains unchanged' >> "$GITHUB_STEP_SUMMARY"
