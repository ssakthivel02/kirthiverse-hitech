name: KirthiVerse Kiki Practice Arena QA
on:
  push:
    branches: [feature/kiki-practice-arena-v1]
    paths:
      - '.github/workflows/kiki-practice-arena-qa.yml'
      - 'app.js'
      - 'index.html'
      - 'data/assessments-*.js'
      - 'data/lessons-*.js'
      - 'learner-adaptive-v26.js'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'data/assessments-*.js'
      - 'data/lessons-*.js'
      - 'learner-adaptive-v26.js'
  workflow_dispatch:
permissions:
  contents: read
env:
  LOCAL_URL: http://127.0.0.1:8771
jobs:
  practice-arena-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5

      - name: Static contract and canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          app=Path('app.js').read_text(errors='ignore')
          idx=Path('index.html').read_text(errors='ignore')
          assessment_files=sorted(Path('data').glob('assessments-*.js'))
          lesson_files=sorted(Path('data').glob('lessons-*.js'))
          assessments='\n'.join(p.read_text(errors='ignore') for p in assessment_files)
          lessons='\n'.join(p.read_text(errors='ignore') for p in lesson_files)

          assert assessment_files, 'Canonical assessment files missing'
          assert lesson_files, 'Canonical lesson files missing'
          assert "'/practice'" in app or '"/practice"' in app, 'Practice route missing'
          assert 'Kiki Practice Arena' in app, 'Practice Arena UI missing'
          assert 'kirthiverse.hitech.practice.v1' in app, 'Local practice state key missing'
          assert 'kirthiverse.hitech.confidence.v1' in app, 'Confidence integration missing'
          assert 'kirthiverse.hitech.mastery.evidence.v1' in app, 'Local mastery evidence key missing'
          assert "source:'practice-self-report'" in app, 'Evidence provenance missing'
          assert 'automaticCorrectness:false' in app, 'Automatic-correctness prohibition missing'
          assert 'automaticMastery:false' in app, 'Automatic-mastery prohibition missing'
          assert 'not exam scores' in app.lower(), 'Learner-facing evidence limitation missing'
          assert 'Calm Mode' in app, 'Calm Mode missing'
          for minutes in ('3','5','10'):
              assert minutes in app, f'{minutes}-minute mission option missing'
          assert 'public leaderboard' in app.lower(), 'No-public-leaderboard safety copy missing'
          assert 'local-only' in app.lower() or 'local only' in app.lower(), 'Local-only safety copy missing'
          assert 'window.KV_ASSESSMENTS' in idx and 'window.KV_LESSONS' in idx, 'Canonical data bootstrap missing'

          assessment_ids=re.findall(r'"stableAssessmentId"\s*:\s*"([^"]+)"', assessments)
          lesson_ids=re.findall(r'"id"\s*:\s*"([^"]+)"', lessons)
          assert len(assessment_ids)==72, f'Canonical assessment baseline changed: {len(assessment_ids)} != 72'
          assert len(set(assessment_ids))==72, 'Duplicate assessment stable IDs detected'
          assert len(lesson_ids)==135, f'Canonical lesson baseline changed: {len(lesson_ids)} != 135'
          assert len(set(lesson_ids))==135, 'Duplicate lesson IDs detected'
          print('PRACTICE_STATIC_PASS: syntax, evidence provenance, safety and canonical 135/72 baseline preserved')
          PY

      - name: Headless Chromium interaction and responsive QA
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8771 --bind 127.0.0.1 >/tmp/kv-practice-http.log 2>&1 &
          spid=$!
          trap 'kill "$spid" 2>/dev/null || true; kill "${cpid:-}" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS "$LOCAL_URL/index.html" >/tmp/kv-practice-index.html && break || sleep 1; done
          rm -rf /tmp/kv-practice-profile
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9581 --user-data-dir=/tmp/kv-practice-profile "$LOCAL_URL/" >/tmp/kv-practice-chrome.log 2>&1 &
          cpid=$!
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:9581/json/list >/tmp/kv-practice-pages.json && break || sleep 1; done
          node <<'NODE'
          const pages=await fetch('http://127.0.0.1:9581/json/list').then(r=>r.json()),page=pages.find(x=>x.type==='page');if(!page)throw Error('No page');
          const ws=new WebSocket(page.webSocketDebuggerUrl);await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=bad});
          let seq=0,pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.bad(Error(m.error.message)):p.ok(m.result)}};
          const send=(method,params={})=>new Promise((ok,bad)=>{const id=++seq;pending.set(id,{ok,bad});ws.send(JSON.stringify({id,method,params}))});
          await send('Runtime.enable');await send('Page.enable');
          const ev=async x=>{const r=await send('Runtime.evaluate',{expression:x,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.text||'eval');return r.result?.value};
          const wait=async(x,l)=>{const end=Date.now()+15000;while(Date.now()<end){try{if(await ev(x))return}catch{}await new Promise(r=>setTimeout(r,250))}throw Error('Timeout '+l)};
          await wait(`!!window.KV_NAVIGATION&&!!window.KV_APP_RUNTIME&&!!window.KV_MASTERY_EVIDENCE`,'navigation + app + mastery evidence runtime');
          const contract=await ev(`window.KV_MASTERY_EVIDENCE`);
          if(!contract.localOnly||contract.automaticCorrectness!==false||contract.automaticMastery!==false||contract.source!=='practice-self-report')throw Error('Mastery evidence runtime contract invalid: '+JSON.stringify(contract));
          await ev(`localStorage.clear();window.KV_NAVIGATION.navigate('/practice');true`);
          await wait(`document.body.innerText.toLowerCase().includes('kiki practice arena')`,'practice route');
          const baseline=await ev(`({lessons:window.KV_LESSONS.length,assessments:window.KV_ASSESSMENTS.length,practiceLinks:[...document.querySelectorAll('a[href="/practice"]')].length,body:document.body.innerText})`);
          if(baseline.lessons!==135||baseline.assessments!==72)throw Error('Canonical browser baseline changed: '+JSON.stringify(baseline));
          if(!baseline.body.includes('Calm Mode'))throw Error('Calm Mode not rendered');
          if(!baseline.body.match(/3\s*(MIN|minute)/i)||!baseline.body.match(/5\s*(MIN|minute)/i)||!baseline.body.match(/10\s*(MIN|minute)/i))throw Error('3/5/10 mission options not all rendered');

          const buttons=await ev(`[...document.querySelectorAll('button')].map((b,i)=>({i,t:(b.innerText||b.textContent||'').trim(),disabled:b.disabled}))`);
          const starter=buttons.find(b=>/start|begin|launch|3 minutes|5 minutes|10 minutes/i.test(b.t)&&!b.disabled);
          if(!starter)throw Error('Practice start button not found');
          await ev(`document.querySelectorAll('button')[${starter.i}].click();true`);await new Promise(r=>setTimeout(r,250));
          const stored=await ev(`localStorage.getItem('kirthiverse.hitech.practice.v1')`);
          if(!stored)throw Error('Practice start did not write local practice state');
          {const s=JSON.parse(stored);if(typeof s!=='object'||!Array.isArray(s.sessions)||!s.active)throw Error('Practice local-state shape invalid after start');}

          const expected=await ev(`(()=>{const p=JSON.parse(localStorage.getItem('kirthiverse.hitech.practice.v1')),i=p.active.indexes[p.active.index],a=window.KV_ASSESSMENTS[i];return {assessmentId:a.stableAssessmentId,lessonId:a.lessonId}})()`);
          const resultButton=await ev(`(()=>{const b=document.querySelector('[data-practice-result="practice"]');if(!b)return false;b.click();return true})()`);
          if(!resultButton)throw Error('Need-more-practice result control missing');
          await new Promise(r=>setTimeout(r,200));
          const evidence=await ev(`JSON.parse(localStorage.getItem('kirthiverse.hitech.mastery.evidence.v1')||'null')`);
          if(!evidence||!Array.isArray(evidence.events)||evidence.events.length!==1)throw Error('Mastery evidence event not recorded exactly once');
          const e=evidence.events[0];
          if(e.assessmentId!==expected.assessmentId||e.lessonId!==expected.lessonId||e.signal!=='revisit'||e.source!=='practice-self-report')throw Error('Mastery evidence provenance mismatch: '+JSON.stringify(e));
          if(!evidence.lessons?.[expected.lessonId]||evidence.lessons[expected.lessonId].revisit!==1)throw Error('Lesson evidence aggregate missing revisit signal');

          await ev(`window.KV_NAVIGATION.navigate('/progress');true`);
          await wait(`!!document.querySelector('[data-mastery-evidence="v1"]')`,'progress evidence panel');
          const progressCopy=await ev(`document.querySelector('[data-mastery-evidence="v1"]').innerText`);
          if(!/self-reported/i.test(progressCopy)||!/not exam scores/i.test(progressCopy)||!/automatic mastery/i.test(progressCopy))throw Error('Progress evidence limitation copy missing');

          for(const [w,h] of [[1440,900],[768,1024],[390,844],[320,800]]){
            await send('Emulation.setDeviceMetricsOverride',{width:w,height:h,deviceScaleFactor:1,mobile:w<760});
            await ev(`window.KV_NAVIGATION.navigate('/');window.KV_NAVIGATION.navigate('/practice');true`);
            await wait(`document.body.innerText.toLowerCase().includes('kiki practice arena')`,'practice '+w+'x'+h);
            const check=await ev(`({overflow:document.documentElement.scrollWidth-innerWidth,arena:[...document.querySelectorAll('span')].some(x=>(x.textContent||'').toLowerCase().includes('kiki practice arena'))})`);
            if(check.overflow>2)throw Error('Horizontal overflow at '+w+'x'+h+': '+check.overflow);
            if(!check.arena)throw Error('Arena missing after SPA navigation at '+w+'x'+h);
          }

          await send('Emulation.setEmulatedMedia',{features:[{name:'prefers-reduced-motion',value:'reduce'}]});
          if(!await ev(`matchMedia('(prefers-reduced-motion: reduce)').matches`))throw Error('Reduced-motion preference not active');
          console.log('PRACTICE_BROWSER_PASS: local evidence provenance, route, SPA navigation, responsive overflow and reduced-motion checks passed');
          ws.close();
          NODE

      - name: QA summary
        if: always()
        run: |
          echo '### Kiki Practice Arena v1 + mastery evidence QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- app.js syntax checked with Node' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical corpus gate: 135 lessons / 72 assessments preserved' >> "$GITHUB_STEP_SUMMARY"
          echo '- Practice route and Kiki Arena render checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- 3/5/10-minute mission options and Calm Mode checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Local-only practice storage contract checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Self-reported evidence recorded against stable assessment + lesson IDs' >> "$GITHUB_STEP_SUMMARY"
          echo '- No automatic correctness or mastery claim permitted' >> "$GITHUB_STEP_SUMMARY"
          echo '- Progress evidence limitation copy checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Responsive overflow checked at 1440x900, 768x1024, 390x844 and 320x800' >> "$GITHUB_STEP_SUMMARY"
          echo '- Reduced-motion preference checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production custom-domain HOLD remains unchanged' >> "$GITHUB_STEP_SUMMARY"
