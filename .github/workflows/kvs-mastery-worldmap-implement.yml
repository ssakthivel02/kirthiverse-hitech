name: KirthiVerse Mastery Next Step Implement
on:
  push:
    branches: [feature/kiki-practice-arena-v1]
    paths:
      - '.github/workflows/kvs-mastery-worldmap-implement.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implement-next-step:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/kiki-practice-arena-v1
          fetch-depth: 0
      - name: Patch explainable next-step engine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          src=p.read_text()
          if 'data-next-step-engine="v1"' in src:
              print('NEXT_STEP_ALREADY_PRESENT')
              raise SystemExit(0)
          pos=src.index('function progressPage(){')
          helper='''function nextStepRecommendation(){\n  const s=state(),started=Array.isArray(s.started)?s.started:[],completed=new Set(s.completed||[]),me=masteryState();\n  const revisit=Object.entries(me.lessons||{}).filter(([id,v])=>L.some(l=>l.id===id)&&(v.revisit||0)>(v.secure||0)).sort((a,b)=>(b[1].lastAt||0)-(a[1].lastAt||0))[0];\n  if(revisit){const lesson=L.find(l=>l.id===revisit[0]);if(lesson)return{kind:'REVISIT',lesson,reason:'your latest local Practice Arena evidence has more revisit signals than secure signals for this lesson'};}\n  const unfinished=started.slice().reverse().map(id=>L.find(l=>l.id===id)).find(l=>l&&!completed.has(l.id));\n  if(unfinished)return{kind:'CONTINUE',lesson:unfinished,reason:'you opened this canonical lesson locally and have not marked the mission complete yet'};\n  const unexplored=L.find(l=>!started.includes(l.id));\n  if(unexplored)return{kind:'EXPLORE',lesson:unexplored,reason:'this is the next not-yet-started canonical lesson in the existing corpus order'};\n  const reviewed=started.slice().reverse().map(id=>L.find(l=>l.id===id)).find(Boolean)||L[0];\n  return reviewed?{kind:'REVIEW',lesson:reviewed,reason:'all canonical lessons are marked complete, so Kiki is offering a transparent review option'}:null;\n}\n\n'''
          src=src[:pos]+helper+src[pos:]
          needle='  const worldSignals=worldSignalMap(),recommendedWorld=worldSignals.slice().sort((a,b)=>{'
          if needle not in src: raise SystemExit('NEXT_STEP_INSERT_MARKER_MISSING')
          src=src.replace(needle,'  const nextStep=nextStepRecommendation();\n'+needle,1)
          target='</section><section class="section universe-section" data-world-constellation="v1">'
          insert='''</section>${nextStep?`<section class="mission mission-v2" data-next-step-engine="v1"><div class="mission-index">NEXT<br><b>✦</b></div><div><span class="kicker">EXPLAINABLE NEXT STEP // ${nextStep.kind}</span><h2>${esc(title(nextStep.lesson))}</h2><p>Kiki suggests this lesson because ${esc(nextStep.reason)}.</p><small>${esc((worldBy(nextStep.lesson.worldId)||worlds[0]).name)} · local deterministic recommendation · not a grade, diagnosis, ranking or automatic mastery judgement</small></div>${link('/lesson/'+nextStep.lesson.id,nextStep.kind==='REVISIT'?'Revisit lesson →':nextStep.kind==='CONTINUE'?'Continue lesson →':nextStep.kind==='EXPLORE'?'Explore lesson →':'Review lesson →','primary')}</section>`:''}<section class="section universe-section" data-world-constellation="v1">'''
          if target not in src: raise SystemExit('NEXT_STEP_UI_MARKER_MISSING')
          src=src.replace(target,insert,1)
          p.write_text(src)
          assessments='\n'.join(x.read_text(errors='ignore') for x in sorted(Path('data').glob('assessments-*.js')))
          lessons='\n'.join(x.read_text(errors='ignore') for x in sorted(Path('data').glob('lessons-*.js')))
          assert len(re.findall(r'"stableAssessmentId"\s*:\s*"([^"]+)"',assessments))==72
          assert len(re.findall(r'"id"\s*:\s*"([^"]+)"',lessons))==135
          assert 'data-next-step-engine="v1"' in src
          assert "kind:'REVISIT'" in src and "kind:'CONTINUE'" in src and "kind:'EXPLORE'" in src and "kind:'REVIEW'" in src
          assert 'not a grade, diagnosis, ranking or automatic mastery judgement' in src
          print('NEXT_STEP_PATCH_PASS')
          PY
          node --check app.js
          git diff --check
      - name: Commit scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No implementation change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'feat(mastery): add explainable next-step engine v1'
          git push origin HEAD:feature/kiki-practice-arena-v1