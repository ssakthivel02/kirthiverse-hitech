name: KirthiVerse Mastery Router Integration
on:
  push:
    branches: [feature/mastery-constellation-v1]
    paths: ['.github/workflows/mastery-router-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/mastery-constellation-v1
      - name: Wire mastery into SPA router
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          idx=Path('index.html')
          s=idx.read_text()
          old='<script src="/app.js?v=HITECH-2026-09-03-14"></script><script src="/core-runtime-v30.js?v=CORE-RUNTIME-V30"></script>'
          new='<script src="/mastery-constellation-v1.js?v=KVS-MASTERY-002"></script><script src="/app.js?v=HITECH-2026-09-03-14"></script><script src="/core-runtime-v30.js?v=CORE-RUNTIME-V30"></script>'
          if new not in s:
              assert old in s, 'index app/core script anchor missing'
              s=s.replace(old,new,1)
              idx.write_text(s)

          m=Path('mastery-constellation-v1.js')
          s=m.read_text()
          old="states:['revisit','mixed','secure-signal','no-evidence'],render,snapshot};"
          new="states:['revisit','mixed','secure-signal','no-evidence'],markup,render,snapshot};"
          if new not in s:
              assert old in s, 'mastery export anchor missing'
              s=s.replace(old,new,1)
              m.write_text(s)

          app=Path('app.js')
          s=app.read_text()
          old="path==='/progress'?progressPage():path.startsWith('/world/')"
          new="path==='/progress'?progressPage():path==='/mastery'?(window.KV_MASTERY_CONSTELLATION?.markup?.()||progressPage()):path.startsWith('/world/')"
          if new not in s:
              assert old in s, 'router anchor missing'
              s=s.replace(old,new,1)

          old="`:'<p>No revisit signal is currently stronger than the secure signal for a lesson.</p>'}</section><div class=\"results\">"
          new="`:'<p>No revisit signal is currently stronger than the secure signal for a lesson.</p>'}<div class=\"actions\">${link('/mastery','Open Mastery Constellation →','primary')}</div></section><div class=\"results\">"
          if new not in s:
              assert old in s, 'progress mastery entry anchor missing'
              s=s.replace(old,new,1)

          old="version:'v24',navigation:'central-delegated'"
          new="version:'v25',navigation:'central-delegated'"
          if new not in s:
              assert old in s, 'runtime version anchor missing'
              s=s.replace(old,new,1)
          app.write_text(s)
          PY
          node --check app.js
          node --check mastery-constellation-v1.js
          git diff --check
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html mastery-constellation-v1.js
          git commit -m 'feat(mastery): integrate constellation into SPA router'
          git push origin HEAD:feature/mastery-constellation-v1
