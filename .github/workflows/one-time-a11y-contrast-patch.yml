name: One-time KirthiVerse accessibility contrast patch

on:
  push:
    branches: [feature/kiki-practice-playwright]
    paths:
      - '.github/workflows/one-time-a11y-contrast-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/kiki-practice-playwright

      - name: Append accessible final contrast overrides once
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq 'KVS_A11Y_CONTRAST_V1' styles.css; then
            cat >> styles.css <<'CSS'

/* KVS_A11Y_CONTRAST_V1 — final visual-master contrast safeguards. */
.system-pill{background:#F1F6F1!important;border-color:#B8CBBF!important}
.system-pill b,.system-pill small{color:#2F5F52!important}
.continuity-v8 p,.continuity-row-v8 small,.a11y-v8 p{color:#425A52!important}
CSS
          fi

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Contrast patch already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          git commit -m 'fix(a11y): raise visual-master text contrast'
          git push origin HEAD:feature/kiki-practice-playwright
