name: KirthiVerse P2 Educator Pilot QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'educator-pilot-v1.js'
      - 'educator-pilot-v1.css'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - 'scripts/educator-pilot-browser-qa.mjs'
      - '.github/workflows/p2-educator-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_URL: http://127.0.0.1:8768
  KV_DEBUG_PORT: '9340'

jobs:
  educator-pilot-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5

      - name: Static evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check educator-pilot-v1.js
          node --check p0-entry-v1.js
          node --check scripts/educator-pilot-browser-qa.mjs
          python3 - <<'PY'
          from pathlib import Path
          js=Path('educator-pilot-v1.js').read_text()
          entry=Path('p0-entry-v1.js').read_text()
          sw=Path('sw-v30.js').read_text()
          for marker in ['NOT a school account','local-only','No device evidence','notSchoolAccount:true','linkedLocal','KV_MASTERY','/educator']:
              assert marker in js, marker
          for forbidden in ['teacherEmail','studentEmail','schoolId','manualGrade']:
              assert forbidden not in js, forbidden
          # Loader may use a relative filename inside the generic add-on helper;
          # the service worker must still cache the canonical root asset path.
          for marker in ['educator-pilot-v1.js','educator-pilot-v1.css']:
              assert marker in entry, marker
              assert f'/{marker}' in sw, marker
          assert 'loadEducatorPilot' in entry and 'loadAddon' in entry
          assert "CACHE='kirthiverse-preview-v31'" in sw
          print('EDUCATOR_PILOT_STATIC_PASS')
          PY

      - name: Start site and Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/kv-educator-http.log 2>&1 &
          echo $! >/tmp/kv-http.pid
          for i in $(seq 1 20); do curl -fsS "$LOCAL_URL/index.html" >/dev/null && break; sleep 1; done
          rm -rf /tmp/kv-educator-chrome
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=$KV_DEBUG_PORT --user-data-dir=/tmp/kv-educator-chrome "$LOCAL_URL/?educator=$(date +%s)" >/tmp/kv-educator-chrome.log 2>&1 &
          echo $! >/tmp/kv-chrome.pid
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:$KV_DEBUG_PORT/json/list >/dev/null && break; sleep 1; done

      - name: Browser end-to-end educator flow
        run: node scripts/educator-pilot-browser-qa.mjs

      - name: Stop local processes
        if: always()
        shell: bash
        run: |
          test ! -f /tmp/kv-chrome.pid || kill "$(cat /tmp/kv-chrome.pid)" 2>/dev/null || true
          test ! -f /tmp/kv-http.pid || kill "$(cat /tmp/kv-http.pid)" 2>/dev/null || true

      - name: QA summary
        if: always()
        run: |
          echo '### KirthiVerse P2 Educator Pilot' >> "$GITHUB_STEP_SUMMARY"
          echo '- parent-gated local educator console checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- roster aliases / no school PII checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- canonical lesson assignment checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- linked learner real completion evidence checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- unlinked learner no-evidence state checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- export excludes Parent PIN material' >> "$GITHUB_STEP_SUMMARY"
          echo '- mobile overflow + PWA cache checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- funding-readiness pilot only; not production school identity/SIS' >> "$GITHUB_STEP_SUMMARY"