name: KirthiVerse P4 Pilot Launch Readiness QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'pilot-launch-v1.js'
      - 'pilot-launch-v1.css'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - 'scripts/pilot-launch-browser-qa.mjs'
      - 'PILOT_LAUNCH_READINESS_EVIDENCE.md'
      - '.github/workflows/p4-pilot-launch-readiness-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_URL: http://127.0.0.1:8772
  KV_DEBUG_PORT: '9344'

jobs:
  pilot-launch-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5

      - name: Static safety and evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check pilot-launch-v1.js
          node --check p0-entry-v1.js
          node --check scripts/pilot-launch-browser-qa.mjs
          python3 - <<'PY'
          from pathlib import Path
          js=Path('pilot-launch-v1.js').read_text()
          entry=Path('p0-entry-v1.js').read_text()
          sw=Path('sw-v30.js').read_text()
          for marker in ['adultIdentityVerified:false','legalConsentVerified:false','productionReady:false','self-attestation','DELETE LOCAL DATA','assistanceEnabledAtStart','kirthiverse.hitech.pilot.launch.v1','kirthiverse.hitech.pilot.metrics.v1']:
              assert marker in js, marker
          for forbidden in ['verified guardian','verified parental consent','COPPA compliant','UK GDPR compliant','legal consent obtained']:
              assert forbidden not in js, forbidden
          assert "startsWith(PREFIX)" in js
          for marker in ['pilot-launch-v1.js','pilot-launch-v1.css','/pilot-readiness']:
              assert marker in entry, marker
          for marker in ['/pilot-launch-v1.js','/pilot-launch-v1.css']:
              assert marker in sw, marker
          print('PILOT_LAUNCH_STATIC_PASS')
          PY

      - name: Start site and Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8772 --bind 127.0.0.1 >/tmp/kv-p4-http.log 2>&1 &
          echo $! >/tmp/kv-p4-http.pid
          for i in $(seq 1 20); do curl -fsS "$LOCAL_URL/index.html" >/dev/null && break; sleep 1; done
          rm -rf /tmp/kv-p4-chrome
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=$KV_DEBUG_PORT --user-data-dir=/tmp/kv-p4-chrome "$LOCAL_URL/?pilotlaunch=$(date +%s)" >/tmp/kv-p4-chrome.log 2>&1 &
          echo $! >/tmp/kv-p4-chrome.pid
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:$KV_DEBUG_PORT/json/list >/dev/null && break; sleep 1; done

      - name: Browser pilot launch lifecycle
        run: node scripts/pilot-launch-browser-qa.mjs

      - name: Stop local processes
        if: always()
        shell: bash
        run: |
          test ! -f /tmp/kv-p4-chrome.pid || kill "$(cat /tmp/kv-p4-chrome.pid)" 2>/dev/null || true
          test ! -f /tmp/kv-p4-http.pid || kill "$(cat /tmp/kv-p4-http.pid)" 2>/dev/null || true

      - name: QA summary
        if: always()
        run: |
          echo '### KirthiVerse P4 Pilot Launch Readiness' >> "$GITHUB_STEP_SUMMARY"
          echo '- Parent-gated pilot lifecycle checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- adult acknowledgement is self-attestation, not verified identity/legal consent' >> "$GITHUB_STEP_SUMMARY"
          echo '- assistance defaults OFF for a new pilot unless adult opts in' >> "$GITHUB_STEP_SUMMARY"
          echo '- fresh metrics observation + final frozen summary checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- export excludes Parent PIN secret material' >> "$GITHUB_STEP_SUMMARY"
          echo '- pilot-only reset preserves core learning + Parent Space' >> "$GITHUB_STEP_SUMMARY"
          echo '- full deletion removes KirthiVerse-prefixed storage only' >> "$GITHUB_STEP_SUMMARY"
          echo '- mobile + PWA cache checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- controlled pilot readiness only; not production/legal compliance certification' >> "$GITHUB_STEP_SUMMARY"