name: KirthiVerse P4 Pilot Readiness QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'pilot-readiness-v1.js'
      - 'pilot-readiness-v1.css'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - 'scripts/pilot-readiness-browser-qa.mjs'
      - 'PILOT_READINESS_EVIDENCE.md'
      - '.github/workflows/p4-pilot-readiness-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_URL: http://127.0.0.1:8772
  KV_DEBUG_PORT: '9344'

jobs:
  pilot-readiness-qa:
    name: pilot-readiness-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5

      - name: Static evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check pilot-readiness-v1.js
          node --check p0-entry-v1.js
          node --check scripts/pilot-readiness-browser-qa.mjs
          python3 - <<'PY'
          from pathlib import Path
          js=Path('pilot-readiness-v1.js').read_text()
          entry=Path('p0-entry-v1.js').read_text()
          sw=Path('sw-v30.js').read_text()
          for marker in ['OWNER_ATTESTED_CONTROLLED_PILOT_READY','externalReviewSelfVerified:false','legalCertification:false','productionReady:false','specialistReviewComplete','consentMaterialsApproved','dataMinimisationReviewed','incidentRouteTested','stoppingCriteriaApproved','metricsProtocolApproved','noProductionClaimAcknowledged','/pilot-readiness']:
              assert marker in js, marker
          for forbidden in ['fetch(', 'XMLHttpRequest', 'sendBeacon(', 'teacherEmail', 'studentEmail', 'schoolId', 'dateOfBirth']:
              assert forbidden not in js, forbidden
          for marker in ['pilot-readiness-v1.js','pilot-readiness-v1.css','/pilot-readiness']:
              assert marker in entry, marker
          for marker in ['/pilot-readiness-v1.js','/pilot-readiness-v1.css']:
              assert marker in sw, marker
          assert "CACHE='kirthiverse-preview-v31'" in sw
          print('PILOT_READINESS_STATIC_PASS')
          PY

      - name: Start site and Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8772 --bind 127.0.0.1 >/tmp/kv-p4-http.log 2>&1 &
          echo $! >/tmp/kv-p4-http.pid
          for i in $(seq 1 20); do curl -fsS "$LOCAL_URL/index.html" >/dev/null && break; sleep 1; done
          rm -rf /tmp/kv-p4-chrome
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=$KV_DEBUG_PORT --user-data-dir=/tmp/kv-p4-chrome "$LOCAL_URL/?pilotreadiness=$(date +%s)" >/tmp/kv-p4-chrome.log 2>&1 &
          echo $! >/tmp/kv-p4-chrome.pid
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:$KV_DEBUG_PORT/json/list >/dev/null && break; sleep 1; done

      - name: Browser controlled-pilot gate
        run: node scripts/pilot-readiness-browser-qa.mjs

      - name: Stop local processes
        if: always()
        shell: bash
        run: |
          test ! -f /tmp/kv-p4-chrome.pid || kill "$(cat /tmp/kv-p4-chrome.pid)" 2>/dev/null || true
          test ! -f /tmp/kv-p4-http.pid || kill "$(cat /tmp/kv-p4-http.pid)" 2>/dev/null || true

      - name: QA summary
        if: always()
        run: |
          echo '### KirthiVerse P4 Controlled Pilot Readiness' >> "$GITHUB_STEP_SUMMARY"
          echo '- Parent Space gate checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- incomplete configuration must HOLD' >> "$GITHUB_STEP_SUMMARY"
          echo '- owner-attested ready requires all structured fields + attestations' >> "$GITHUB_STEP_SUMMARY"
          echo '- legal certification / production-ready / external self-verification remain false' >> "$GITHUB_STEP_SUMMARY"
          echo '- export excludes Parent PIN material' >> "$GITHUB_STEP_SUMMARY"
          echo '- mobile overflow + PWA cache checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- software gate only; specialist/legal review remains external' >> "$GITHUB_STEP_SUMMARY"
