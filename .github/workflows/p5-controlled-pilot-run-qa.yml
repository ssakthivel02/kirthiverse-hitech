name: KirthiVerse P5 Controlled Pilot Run QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'pilot-run-v1.js'
      - 'pilot-run-v1.css'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - 'scripts/pilot-run-browser-qa.mjs'
      - 'PILOT_RUN_EVIDENCE.md'
      - '.github/workflows/p5-controlled-pilot-run-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_URL: http://127.0.0.1:8774
  KV_DEBUG_PORT: '9346'

jobs:
  controlled-pilot-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
      - name: Static P4-to-P5 evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check pilot-run-v1.js
          node --check p0-entry-v1.js
          node --check scripts/pilot-run-browser-qa.mjs
          python3 - <<'PY'
          from pathlib import Path
          js=Path('pilot-run-v1.js').read_text(); entry=Path('p0-entry-v1.js').read_text(); sw=Path('sw-v30.js').read_text()
          for marker in ['requiresReadiness:true','window.KV_PILOT_READINESS','readinessAtStart','readinessAtEnd','adultIdentityVerified:false','legalConsentVerified:false','externalReviewIndependentlyVerified:false','productionReady:false','DELETE LOCAL DATA','kirthiverse.hitech.pilot.run.v1']:
              assert marker in js, marker
          # Reject actual positive compliance/identity claims, while allowing truthful wording such as
          # "no verified guardian identity" or "does not verify legal consent".
          for forbidden in ['adultIdentityVerified:true','legalConsentVerified:true','externalReviewIndependentlyVerified:true','productionReady:true','legalCertification:true','COPPA compliant','UK GDPR compliant','production certified']:
              assert forbidden not in js, forbidden
          assert "startsWith(PREFIX)" in js
          for marker in ['pilot-run-v1.js','pilot-run-v1.css','/pilot-run']:
              assert marker in entry, marker
          for marker in ['/pilot-run-v1.js','/pilot-run-v1.css']:
              assert marker in sw, marker
          print('CONTROLLED_PILOT_RUN_STATIC_PASS')
          PY
      - name: Start site and Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$chrome"
          python3 -m http.server 8774 --bind 127.0.0.1 >/tmp/kv-p5-http.log 2>&1 & echo $! >/tmp/kv-p5-http.pid
          for i in $(seq 1 20); do curl -fsS "$LOCAL_URL/index.html" >/dev/null && break; sleep 1; done
          rm -rf /tmp/kv-p5-chrome
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=$KV_DEBUG_PORT --user-data-dir=/tmp/kv-p5-chrome "$LOCAL_URL/?pilotrun=$(date +%s)" >/tmp/kv-p5-chrome.log 2>&1 & echo $! >/tmp/kv-p5-chrome.pid
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:$KV_DEBUG_PORT/json/list >/dev/null && break; sleep 1; done
      - name: Browser P4-to-P5 controlled lifecycle
        run: node scripts/pilot-run-browser-qa.mjs
      - name: Stop local processes
        if: always()
        shell: bash
        run: |
          test ! -f /tmp/kv-p5-chrome.pid || kill "$(cat /tmp/kv-p5-chrome.pid)" 2>/dev/null || true
          test ! -f /tmp/kv-p5-http.pid || kill "$(cat /tmp/kv-p5-http.pid)" 2>/dev/null || true
      - name: QA summary
        if: always()
        run: |
          echo '### KirthiVerse P5 Controlled Pilot Run' >> "$GITHUB_STEP_SUMMARY"
          echo '- P5 start blocked while P4 readiness is HOLD' >> "$GITHUB_STEP_SUMMARY"
          echo '- P4 READY snapshot frozen at run start/end' >> "$GITHUB_STEP_SUMMARY"
          echo '- assistance defaults OFF for a new run' >> "$GITHUB_STEP_SUMMARY"
          echo '- pre-run metrics are not backfilled into run evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '- readiness regression during active run produces PAUSE/HOLD signal' >> "$GITHUB_STEP_SUMMARY"
          echo '- final metrics evidence + secret-safe export checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- run reset preserves P4/Parent/core learning data' >> "$GITHUB_STEP_SUMMARY"
          echo '- full local deletion remains KirthiVerse-prefix scoped' >> "$GITHUB_STEP_SUMMARY"
          echo '- mobile + PWA checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- local controlled-pilot evidence only; no legal/production certification' >> "$GITHUB_STEP_SUMMARY"