name: KirthiVerse P8 Claim-Safe Funding Brief QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/render-funding-evidence-brief.mjs'
      - 'tests/funding-evidence-brief.test.mjs'
      - 'FUNDING_EVIDENCE_BRIEF.md'
      - '.github/workflows/p8-claim-safe-funding-brief-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  funding-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Static P8 claim boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/render-funding-evidence-brief.mjs
          node --check tests/funding-evidence-brief.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/render-funding-evidence-brief.mjs').read_text()
          for x in ['kirthiverse.p8.claim-safe-funding-brief.v1','MANIFEST_DIGEST_MISMATCH','TOTALS_MISMATCH','SENSITIVE_FIELD_PRESENT','canClaimRetention:false','canClaimLearningImprovement:false','canClaimCohortOutcome:false','canClaimProductionReadiness:false']:
              assert x in s,x
          for x in ['canClaimRetention:true','canClaimLearningImprovement:true','canClaimCohortOutcome:true','canClaimProductionReadiness:true']:
              assert x not in s,x
          print('P8_STATIC_CONTRACT_PASS')
          PY
      - name: Deterministic funding-brief tests
        run: node tests/funding-evidence-brief.test.mjs
      - name: QA summary
        if: always()
        run: |
          echo '### KirthiVerse P8 Claim-Safe Funding Brief' >> "$GITHUB_STEP_SUMMARY"
          echo '- P7 manifest digest and totals are recomputed before rendering' >> "$GITHUB_STEP_SUMMARY"
          echo '- unsafe claim gates and sensitive fields fail closed' >> "$GITHUB_STEP_SUMMARY"
          echo '- mixed observation windows receive bounded wording' >> "$GITHUB_STEP_SUMMARY"
          echo '- strict all-seven-day mode fails closed when any run is incomplete' >> "$GITHUB_STEP_SUMMARY"
          echo '- generated brief keeps retention/improvement/cohort/compliance/production claims blocked' >> "$GITHUB_STEP_SUMMARY"
