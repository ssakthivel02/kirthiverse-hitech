name: Kiki Practice Arena QA
on:
  pull_request:
    paths:
      - 'practice.html'
      - 'practice-arena.js'
      - 'practice-arena.css'
      - 'data/assessments-*.js'
      - 'scripts/validate-practice-arena.mjs'
      - '.github/workflows/practice-arena-qa.yml'
  push:
    branches: [feat/kiki-practice-arena-v1]
    paths:
      - 'practice.html'
      - 'practice-arena.js'
      - 'practice-arena.css'
      - 'data/assessments-*.js'
      - 'scripts/validate-practice-arena.mjs'
      - '.github/workflows/practice-arena-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate canonical-data and local-only contracts
        run: node scripts/validate-practice-arena.mjs
      - name: Static HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/kv-practice-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8768/practice.html >/tmp/practice.html && break || sleep 1; done
          grep -Fq 'id="arena"' /tmp/practice.html
          curl -fsS http://127.0.0.1:8768/practice-arena.js >/tmp/practice.js
          curl -fsS http://127.0.0.1:8768/practice-arena.css >/tmp/practice.css
          test -s /tmp/practice.js
          test -s /tmp/practice.css
      - name: Headless Chromium interaction QA
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/kv-practice-browser.log 2>&1 &
          spid=$!
          trap 'kill "$spid" 2>/dev/null || true; kill "${cpid:-}" 2>/dev/null || true' EXIT
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9557 --user-data-dir=/tmp/kv-practice-profile http://127.0.0.1:8769/practice.html >/tmp/kv-practice-chrome.log 2>&1 &
          cpid=$!
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:9557/json/list >/tmp/kv-practice-pages.json && break || sleep 1; done
          node <<'NODE'
          const pages=await fetch('http://127.0.0.1:9557/json/list').then(r=>r.json());
          const page=pages.find(x=>x.type==='page'); if(!page) throw Error('No browser page');
          const ws=new WebSocket(page.webSocketDebuggerUrl); await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=bad});
          let seq=0; const pending=new Map(); ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.bad(Error(m.error.message)):p.ok(m.result)}};
          const send=(method,params={})=>new Promise((ok,bad)=>{const id=++seq;pending.set(id,{ok,bad});ws.send(JSON.stringify({id,method,params}))});
          await send('Runtime.enable');
          const ev=async expression=>{const r=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.text||'eval failed');return r.result?.value};
          const wait=async(expr,label)=>{const end=Date.now()+15000;while(Date.now()<end){try{if(await ev(expr))return}catch{}await new Promise(r=>setTimeout(r,250))}throw Error('Timeout: '+label)};
          await wait(`document.querySelectorAll('[data-start]').length===3`,'mode buttons');
          if(!(await ev(`document.getElementById('calm').checked===true`))) throw Error('Calm Mode not default-on');
          await ev(`document.querySelector('[data-start="3"]').click();true`);
          await wait(`document.querySelector('[data-rate="retry"]')&&document.querySelector('details')`,'session question');
          await ev(`document.querySelector('details').open=true;document.querySelector('[data-rate="retry"]').click();true`);
          await wait(`JSON.parse(localStorage.getItem('kirthiverse.hitech.practice.v1')).retryIds.length===1`,'retry persistence');
          const state=await ev(`JSON.parse(localStorage.getItem('kirthiverse.hitech.practice.v1'))`);
          if(!state.queue.length||!state.history.length) throw Error('Local state/history missing');
          console.log('PRACTICE_ARENA_BROWSER_PASS: modes, Calm default, reveal, retry persistence');
          ws.close();
          NODE
      - name: QA summary
        if: always()
        run: |
          echo '### Kiki Practice Arena QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical assessment loading and stable-ID uniqueness checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- No fetch/XHR/WebSocket/beacon/camera/recording capability in arena runtime' >> "$GITHUB_STEP_SUMMARY"
          echo '- Calm Mode defaults on' >> "$GITHUB_STEP_SUMMARY"
          echo '- Retry signal persists locally' >> "$GITHUB_STEP_SUMMARY"
          echo '- Reduced-motion and small-screen CSS markers checked' >> "$GITHUB_STEP_SUMMARY"
