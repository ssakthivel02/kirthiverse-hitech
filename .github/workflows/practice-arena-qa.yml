name: KirthiVerse Practice Arena QA
on:
  pull_request:
    paths:
      - 'practice-arena-v1.js'
      - 'practice-arena-v1.css'
      - 'p0-entry-v1.js'
      - 'sw-v30.js'
      - 'scripts/validate-practice-arena-recovery.mjs'
      - 'scripts/practice-arena-browser-qa.mjs'
      - '.github/workflows/practice-arena-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  practice-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      LOCAL_URL: http://127.0.0.1:8781
      KV_DEBUG_PORT: '9351'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
      - name: Static recovery and integration contract
        shell: bash
        run: |
          set -euo pipefail
          node --check practice-arena-v1.js
          node --check p0-entry-v1.js
          node --check scripts/practice-arena-browser-qa.mjs
          node scripts/validate-practice-arena-recovery.mjs
          python3 - <<'PY'
          from pathlib import Path
          entry=Path('p0-entry-v1.js').read_text()
          sw=Path('sw-v30.js').read_text()
          for marker in ["'/practice-arena'",'practice-arena-v1.js','practice-arena-v1.css','loadPracticeArena']:
              assert marker in entry, marker
          for marker in ['/practice-arena-v1.js','/practice-arena-v1.css']:
              assert marker in sw, marker
          assert "CACHE='kirthiverse-preview-v49'" in sw
          print('PRACTICE_ARENA_INTEGRATION_STATIC_PASS')
          PY
      - name: Start site and Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8781 --bind 127.0.0.1 >/tmp/kv-arena-http.log 2>&1 & echo $! >/tmp/kv-arena-http.pid
          for i in $(seq 1 20); do curl -fsS "$LOCAL_URL/index.html" >/dev/null && break; sleep 1; done
          curl -fsS "$LOCAL_URL/index.html" >/dev/null
          rm -rf /tmp/kv-arena-chrome
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=$KV_DEBUG_PORT --user-data-dir=/tmp/kv-arena-chrome "$LOCAL_URL/?arena=$(date +%s)" >/tmp/kv-arena-chrome.log 2>&1 & echo $! >/tmp/kv-arena-chrome.pid
          ready=0
          for i in $(seq 1 25); do if curl -fsS "http://127.0.0.1:$KV_DEBUG_PORT/json/list" >/dev/null; then ready=1; break; fi; sleep 1; done
          if [ "$ready" -ne 1 ]; then cat /tmp/kv-arena-chrome.log || true; exit 1; fi
      - name: Browser accessibility mobile offline qualification
        run: node scripts/practice-arena-browser-qa.mjs
      - name: Stop local processes
        if: always()
        shell: bash
        run: |
          test ! -f /tmp/kv-arena-chrome.pid || kill "$(cat /tmp/kv-arena-chrome.pid)" 2>/dev/null || true
          test ! -f /tmp/kv-arena-http.pid || kill "$(cat /tmp/kv-arena-http.pid)" 2>/dev/null || true
      - name: QA summary
        if: always()
        run: |
          echo '### Practice Arena Recovery Qualification' >> "$GITHUB_STEP_SUMMARY"
          echo '- canonical assessment-only runtime contract checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- current shell/navigation discovery checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- accessible names + reduced-motion emulation checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- 390px mobile overflow/touch target checks executed' >> "$GITHUB_STEP_SUMMARY"
          echo '- active v49 precache + offline route reload checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- local-only/confidence-not-mastery safety boundary preserved' >> "$GITHUB_STEP_SUMMARY"
