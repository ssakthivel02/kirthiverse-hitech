name: KirthiVerse Practice Integration Regression
on:
  pull_request:
    paths:
      - 'app.js'
      - 'core-runtime-v30.js'
      - 'visual-controller-v27.js'
      - 'practice.html'
      - 'practice-arena.js'
      - 'practice-arena.css'
      - 'data/lessons-*.js'
      - 'data/assessments-*.js'
      - '.github/workflows/practice-integration-regression.yml'
  push:
    branches: [feat/kiki-practice-arena-v1]
    paths:
      - 'app.js'
      - 'core-runtime-v30.js'
      - 'visual-controller-v27.js'
      - 'practice.html'
      - 'practice-arena.js'
      - 'practice-arena.css'
      - 'data/lessons-*.js'
      - 'data/assessments-*.js'
      - '.github/workflows/practice-integration-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Browser regression across canonical routes and Practice Arena
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8770 --bind 127.0.0.1 >/tmp/kv-regression-http.log 2>&1 &
          spid=$!
          trap 'kill "$spid" 2>/dev/null || true; kill "${cpid:-}" 2>/dev/null || true' EXIT
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9558 --user-data-dir=/tmp/kv-regression-profile http://127.0.0.1:8770/ >/tmp/kv-regression-chrome.log 2>&1 &
          cpid=$!
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:9558/json/list >/tmp/kv-regression-pages.json && break || sleep 1; done
          node <<'NODE'
          const pages=await fetch('http://127.0.0.1:9558/json/list').then(r=>r.json());
          const page=pages.find(x=>x.type==='page'); if(!page) throw Error('No Chromium page');
          const ws=new WebSocket(page.webSocketDebuggerUrl); await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=bad});
          let seq=0; const pending=new Map(); ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.bad(Error(m.error.message)):p.ok(m.result)}};
          const send=(method,params={})=>new Promise((ok,bad)=>{const id=++seq;pending.set(id,{ok,bad});ws.send(JSON.stringify({id,method,params}))});
          await send('Runtime.enable');
          const ev=async expression=>{const r=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.text||'eval failed');return r.result?.value};
          const wait=async(expr,label)=>{const end=Date.now()+18000;while(Date.now()<end){try{if(await ev(expr))return}catch{}await new Promise(r=>setTimeout(r,250))}throw Error('Timeout: '+label)};
          await wait(`!!window.KV_APP_RUNTIME&&!!window.KV_NAVIGATION&&document.querySelector('.hero-v2')`,'home runtime');
          if(!(await ev(`window.KV_LESSONS.length===135&&window.KV_ASSESSMENTS.length===72`))) throw Error('Canonical corpus count drift');
          if(!(await ev(`!!document.querySelector('.vm-nav-practice')&&!document.querySelector('.vm-nav-practice').hasAttribute('data-link')`))) throw Error('Practice direct nav integration missing');
          await ev(`window.KV_NAVIGATION.navigate('/worlds');true`); await wait(`location.pathname==='/worlds'&&document.querySelectorAll('.world-row').length===11`,'worlds route');
          await ev(`window.KV_NAVIGATION.navigate('/search');true`); await wait(`location.pathname==='/search'&&!!document.getElementById('q')`,'search route');
          await ev(`document.getElementById('q').value='Science';document.getElementById('q').dispatchEvent(new Event('input',{bubbles:true}));true`); await wait(`document.querySelectorAll('#results a').length>0`,'search results');
          await ev(`window.KV_NAVIGATION.navigate('/progress');true`); await wait(`location.pathname==='/progress'&&!!document.querySelector('.progress-hero')`,'progress route');
          const lesson=await ev(`window.KV_LESSONS[0].id`); if(!lesson) throw Error('No canonical lesson id');
          await ev(`window.KV_NAVIGATION.navigate('/lesson/'+encodeURIComponent(${JSON.stringify('PLACEHOLDER')}));true`.replace('PLACEHOLDER',lesson));
          await wait(`location.pathname.startsWith('/lesson/')&&!!document.querySelector('.lesson-content')&&!!document.getElementById('complete')`,'lesson route');
          await wait(`!!document.querySelector('[data-teacher="v2"]')`,'Kiki teacher continuity');
          await ev(`window.KV_NAVIGATION.navigate('/');true`); await wait(`location.pathname==='/'&&!!document.querySelector('.hero-v2')&&!!document.querySelector('.vm-practice-cta')`,'return home');
          if((await ev(`window.KV_NAVIGATION.count`))<5) throw Error('Central navigation did not record route journey');
          await ev(`document.querySelector('.vm-practice-cta').click();true`); await wait(`location.pathname==='/practice.html'&&document.querySelectorAll('[data-start]').length===3`,'Practice Arena direct transition');
          console.log('KIRTHIVERSE_PRACTICE_INTEGRATION_PASS: canonical counts, home/worlds/search/progress/lesson, Kiki continuity and direct Practice Arena entry');
          ws.close();
          NODE
      - name: Regression summary
        if: always()
        run: |
          echo '### Practice integration regression' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical baseline enforced: 135 lessons / 72 assessments / 11 worlds' >> "$GITHUB_STEP_SUMMARY"
          echo '- Home, Worlds, Search, Progress and Lesson SPA routes exercised' >> "$GITHUB_STEP_SUMMARY"
          echo '- Search interaction exercised' >> "$GITHUB_STEP_SUMMARY"
          echo '- Kiki teacher continuity checked on canonical lesson' >> "$GITHUB_STEP_SUMMARY"
          echo '- Direct Home → Practice Arena transition exercised' >> "$GITHUB_STEP_SUMMARY"
          echo '- No production DNS or cloud identity changes' >> "$GITHUB_STEP_SUMMARY"
