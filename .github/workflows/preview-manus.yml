name: KirthiVerse Manus Preview
on:
  push:
    branches: [design/manus-visual-master]
  workflow_dispatch:
concurrency:
  group: kirthiverse-manus-preview-worker
  cancel-in-progress: true
permissions:
  contents: read
env:
  RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://kirthiverse-hitech.ssakthivel02.workers.dev
jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual candidate
        uses: actions/checkout@v4

      - name: Validate lean browser runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          h=Path('index.html').read_text(); p=json.loads(Path('visual-preview.json').read_text()); r=json.loads(Path('preview-runtime.json').read_text())
          assert 'CORE-RUNTIME-V30' in h and '/core-runtime-v30.js?v=CORE-RUNTIME-V30' in h
          assert 'visual-preview-gate.js' not in h and Path('visual-preview-gate.js').is_file()
          assert r['diagnostics']['browserLoaded'] is False and r['diagnostics']['ciOnly'] is True
          assert p['runtimeConsolidation']['browserJsRequestCeiling']==6
          assert p['runtimeConsolidation']['measuredCombinedBytesCeiling']==168000
          assert p['browserQa']['desktopViewport']=='1440x900'
          assert p['browserQa']['mobileViewport']=='390x844'
          assert p['browserQa']['routeMatrix']==['/','/worlds','/world/mathematics','/search','/progress','/profile','/lesson/math.number.place-value.base10.age6-8.l1']
          assert p['canonical']=={'lessons':135,'assessments':72,'worlds':11}
          assert p['mergeAllowed'] is False and p['productionCutoverAllowed'] is False
          core=Path('core-runtime-v30.js').read_text(); sw=Path('sw-v30.js').read_text()
          for m in ['KV_CORE_RUNTIME','KV_FOCUS_RUNTIME','focusSession:true','profileGoalAware:true']: assert m in core
          assert 'kirthiverse-preview-v30' in sw
          contamination=['__manus__','manus-storage','vite-plugin-manus-runtime','BUILT_IN_FORGE','artifacts.cloudflare.net','ManusDialog']
          loaded=['app.js','core-runtime-v30.js','learning-foundation-v19.js','learning-tools-v20.js','visual-controller-v27.js','learner-adaptive-v26.js']
          assert not any(x in '\n'.join(Path(f).read_text() for f in loaded) for x in contamination)
          print('Lean runtime + browser QA contract PASS.')
          PY

      - name: Measure runtime payload and request count
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          h=Path('index.html').read_text(); refs=re.findall(r'(?:href|src)=["\'](/[^"\']+\.(?:css|js)(?:\?[^"\']*)?)["\']',h); a=[]
          for ref in refs:
            p=ref.split('?',1)[0].lstrip('/')
            if not p.startswith('data/') and p not in a:a.append(p)
          css=sum(Path(p).stat().st_size for p in a if p.endswith('.css')); js=sum(Path(p).stat().st_size for p in a if p.endswith('.js')); total=css+js
          scripts=sum(p.endswith('.js') for p in a); styles=sum(p.endswith('.css') for p in a)
          assert scripts<=6, f'JS request regression: {scripts}'
          assert total<=168000, f'payload regression: {total}'
          print(f'PAYLOAD_CSS_BYTES={css}\nPAYLOAD_JS_BYTES={js}\nPAYLOAD_COMBINED_BYTES={total}\nJS_REQUESTS={scripts}\nCSS_REQUESTS={styles}')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(f'### Lean runtime footprint\n- CSS: {css:,} bytes\n- JS: {js:,} bytes\n- Combined: {total:,} bytes\n- JS requests: {scripts}\n- CSS requests: {styles}\n')
          PY

      - name: Confirm Worker target
        run: |
          grep -q '"name": "kirthiverse-hitech"' wrangler.jsonc
          grep -q '"directory": "."' wrangler.jsonc

      - name: Normalize Cloudflare credential formatting
        if: ${{ env.RAW_CLOUDFLARE_API_TOKEN != '' && env.RAW_CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          t=os.environ.get('RAW_CLOUDFLARE_API_TOKEN','').strip().strip('"').strip("'"); a=os.environ.get('RAW_CLOUDFLARE_ACCOUNT_ID','').strip().strip('"').strip("'")
          if t.lower().startswith('bearer '): t=t[7:].strip()
          if not t or not a: raise SystemExit('Normalized Cloudflare credential is empty.')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CLOUDFLARE_API_TOKEN_CLEAN='+t+'\nCLOUDFLARE_ACCOUNT_ID_CLEAN='+a+'\n')
          PY

      - name: Deploy controlled preview to existing Worker
        if: ${{ env.RAW_CLOUDFLARE_API_TOKEN != '' && env.RAW_CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN_CLEAN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID_CLEAN }}
        run: npx --yes wrangler@4 deploy --assets=.

      - name: Post-deploy route and asset integrity
        if: ${{ env.RAW_CLOUDFLARE_API_TOKEN != '' && env.RAW_CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          fetch(){ local l="$1" u="$2" o="$3"; c=$(curl -fsSL --retry 4 --retry-delay 2 -o "$o" -w '%{http_code}' "$u"); echo "SMOKE_HTTP: $l=$c"; test "$c" = 200; test -s "$o"; }
          nonhtml(){ ! grep -Eqi '<!doctype|<html' "$1"; }
          wait_html(){ local l="$1" u="$2" o="$3" ok=0; for i in $(seq 1 18); do fetch "$l" "$u?smoke=$(date +%s)-$i" "$o"; if grep -Fq 'CORE-RUNTIME-V30' "$o" && ! grep -Fq 'visual-preview-gate.js' "$o"; then ok=1; break; fi; sleep 2; done; test "$ok" = 1; }
          wait_asset(){ local l="$1" u="$2" m="$3" o="$4" ok=0; for i in $(seq 1 18); do fetch "$l" "$u?smoke=$(date +%s)-$i" "$o"; if nonhtml "$o" && grep -Fq "$m" "$o"; then ok=1; break; fi; sleep 2; done; test "$ok" = 1; }
          wait_html index "$PREVIEW_URL/index.html" /tmp/index.html
          for r in '' worlds world/mathematics search progress profile lesson/math.number.place-value.base10.age6-8.l1; do wait_html route "${PREVIEW_URL}/${r}" /tmp/route.html; done
          wait_asset core "$PREVIEW_URL/core-runtime-v30.js" 'KV_FOCUS_RUNTIME' /tmp/core.js
          wait_asset sw "$PREVIEW_URL/sw-v30.js" 'kirthiverse-preview-v30' /tmp/sw.js
          bust=$(date +%s)
          for css in styles.css learning-foundation-v19.css learning-tools-v20.css visual-master-v15.css visual-master-pages-v15.css visual-master-features-v15.css; do fetch css "$PREVIEW_URL/$css?smoke=$bust" /tmp/css; nonhtml /tmp/css; curl -fsSLI "$PREVIEW_URL/$css?smoke=$bust" | grep -Eqi '^content-type:[[:space:]]*text/css'; done

      - name: Browser-visible desktop and mobile QA
        if: ${{ env.RAW_CLOUDFLARE_API_TOKEN != '' && env.RAW_CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          bust=$(date +%s)
          run_dom(){
            local label="$1"
            local size="$2"
            local path="$3"
            local out="/tmp/${label}.html"
            "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="$size" --virtual-time-budget=12000 --dump-dom "$PREVIEW_URL$path?browser=$bust" >"$out" 2>"/tmp/${label}.stderr"
            test -s "$out"
            grep -Fq '<main' "$out"
            ! grep -Fq 'visual-preview-gate.js' "$out"
            echo "BROWSER_PASS: $label $size $path"
          }
          run_dom desktop_home 1440,900 /
          grep -Fq 'data-focus-session="v30"' /tmp/desktop_home.html
          grep -Fq 'data-personal-home="v26"' /tmp/desktop_home.html
          grep -Fq 'FOCUS SESSION // LOCAL ONLY' /tmp/desktop_home.html
          run_dom mobile_home 390,844 /
          grep -Fq 'data-focus-session="v30"' /tmp/mobile_home.html
          grep -Fq 'data-personal-home="v26"' /tmp/mobile_home.html
          run_dom desktop_worlds 1440,900 /worlds
          run_dom desktop_world 1440,900 /world/mathematics
          run_dom desktop_search 1440,900 /search
          run_dom desktop_progress 1440,900 /progress
          grep -Fq 'data-focus-session="v30"' /tmp/desktop_progress.html
          run_dom mobile_progress 390,844 /progress
          grep -Fq 'data-focus-session="v30"' /tmp/mobile_progress.html
          run_dom desktop_profile 1440,900 /profile
          grep -Fq 'data-profile-runtime="v26"' /tmp/desktop_profile.html
          run_dom mobile_profile 390,844 /profile
          grep -Fq 'data-profile-runtime="v26"' /tmp/mobile_profile.html
          run_dom desktop_lesson 1440,900 /lesson/math.number.place-value.base10.age6-8.l1
          run_dom mobile_lesson 390,844 /lesson/math.number.place-value.base10.age6-8.l1
          python - <<'PY'
          from pathlib import Path
          corpus=''.join(Path('/tmp/'+n).read_text(errors='ignore') for n in ['desktop_home.html','desktop_worlds.html','desktop_world.html','desktop_search.html','desktop_progress.html','desktop_profile.html','desktop_lesson.html'])
          assert any('\u0b80' <= c <= '\u0bff' for c in corpus), 'Tamil browser rendering signal missing'
          assert 'MANUS-VISUAL-MASTER-05' in corpus, 'visual candidate marker missing'
          print('BROWSER_PASS: Tamil + visual candidate signals')
          PY
          echo '### Browser QA matrix PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Desktop: 1440x900' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mobile: 390x844' >> "$GITHUB_STEP_SUMMARY"
          echo '- Routes: Home, Worlds, Mathematics world, Search, Progress, Profile, canonical lesson' >> "$GITHUB_STEP_SUMMARY"

      - name: Preview safety summary
        if: always()
        run: |
          echo '### KirthiVerse controlled preview' >> "$GITHUB_STEP_SUMMARY"
          echo '- Lean browser runtime: 6 JS requests maximum' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser QA: desktop + mobile critical route matrix' >> "$GITHUB_STEP_SUMMARY"
          echo '- Manus visual PNG package: rights not verified; asset bytes not introduced' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production custom-domain configuration: unchanged' >> "$GITHUB_STEP_SUMMARY"
          echo '- Paid Cloudflare services: none enabled' >> "$GITHUB_STEP_SUMMARY"
