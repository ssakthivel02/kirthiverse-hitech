name: KirthiVerse Manus Preview

on:
  push:
    branches:
      - design/manus-visual-master
  workflow_dispatch:

permissions:
  contents: read

env:
  RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://kirthiverse-hitech.ssakthivel02.workers.dev

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual candidate
        uses: actions/checkout@v4

      - name: Validate candidate contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MANUS-VISUAL-MASTER-05' index.html
          grep -q 'navigation-v18.js' index.html
          grep -q 'delegated-capture' navigation-v18.js
          grep -q 'agePathCentralized:true' navigation-v18.js
          grep -q "source:'router-popstate-after-app-render'" runtime-lifecycle-v16.js
          grep -q "observerScope:'none'" runtime-lifecycle-v16.js
          ! grep -q 'new MutationObserver' runtime-lifecycle-v16.js
          grep -q '"lifecycleObserver": false' preview-runtime.json
          grep -q '"lessons":135' visual-preview.json
          grep -q '"assessments":72' visual-preview.json
          grep -q '"worlds":11' visual-preview.json
          grep -q '"productionCutoverAllowed": false' visual-preview.json
          grep -q '"mergeAllowed": false' visual-preview.json
          ! grep -Eq 'diagnostics-v9\.js|release-v10\.js|gate-v11\.js|rc-v12\.js|closure-v13\.js|preprod-v14\.js' index.html
          ! grep -Eq '__manus__|manus-storage|vite-plugin-manus-runtime|BUILT_IN_FORGE|artifacts\.cloudflare\.net|ManusDialog' app.js navigation-v18.js runtime-lifecycle-v16.js experience.js intelligence-v4.js cockpit-v5.js mastery-v6.js workspace-v7.js planner-v8.js visual-master-v15.js profile-v17.js visual-master-pages-v15.js
          ! grep -q "addEventListener('popstate'" mastery-v6.js workspace-v7.js planner-v8.js
          grep -q "KV_MASTERY_LIFECYCLE='kv:rendered'" mastery-v6.js
          grep -q "KV_WORKSPACE_LIFECYCLE='kv:rendered'" workspace-v7.js
          grep -q "KV_PLANNER_LIFECYCLE='kv:rendered'" planner-v8.js
          echo 'Candidate contract validated.'

      - name: Confirm Worker target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "kirthiverse-hitech"' wrangler.jsonc
          grep -q '"directory": "."' wrangler.jsonc
          echo 'Existing kirthiverse-hitech Worker target confirmed.'

      - name: Normalize Cloudflare credential formatting
        if: ${{ env.RAW_CLOUDFLARE_API_TOKEN != '' && env.RAW_CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          token=os.environ.get('RAW_CLOUDFLARE_API_TOKEN','').strip().strip('"').strip("'")
          if token.lower().startswith('bearer '):
              token=token[7:].strip()
          account=os.environ.get('RAW_CLOUDFLARE_ACCOUNT_ID','').strip().strip('"').strip("'")
          if not token or not account:
              raise SystemExit('Normalized Cloudflare credential is empty.')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('CLOUDFLARE_API_TOKEN_CLEAN='+token+'\n')
              f.write('CLOUDFLARE_ACCOUNT_ID_CLEAN='+account+'\n')
          PY
          echo 'Cloudflare credential formatting normalized without printing secret values.'

      - name: Deploy controlled preview to existing Worker
        if: ${{ env.RAW_CLOUDFLARE_API_TOKEN != '' && env.RAW_CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN_CLEAN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID_CLEAN }}
        run: npx --yes wrangler@4 deploy --assets=.

      - name: Post-deploy HTTP smoke gate
        if: ${{ env.RAW_CLOUDFLARE_API_TOKEN != '' && env.RAW_CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 4

          fetch() {
            local label="$1" url="$2" out="$3"
            echo "SMOKE_FETCH_START: $label"
            code=$(curl --silent --show-error --location --retry 4 --retry-delay 2 --output "$out" --write-out '%{http_code}' "$url")
            echo "SMOKE_HTTP: $label=$code"
            test "$code" = "200"
            test -s "$out"
          }

          expect_marker() {
            local label="$1" file="$2" marker="$3"
            if grep -Fq "$marker" "$file"; then
              echo "SMOKE_ASSERT_PASS: $label"
            else
              echo "SMOKE_ASSERT_FAIL: $label"
              exit 1
            fi
          }

          fetch 'home' "$PREVIEW_URL/" /tmp/home.html
          expect_marker 'home candidate marker' /tmp/home.html 'MANUS-VISUAL-MASTER-05'

          fetch 'preview contract' "$PREVIEW_URL/visual-preview.json" /tmp/preview.json
          python - <<'PY'
          import json
          with open('/tmp/preview.json', encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('candidate') == 'MANUS-VISUAL-MASTER-05', data.get('candidate')
          canonical=data.get('canonical') or {}
          assert canonical.get('lessons') == 135, canonical
          assert canonical.get('assessments') == 72, canonical
          assert canonical.get('worlds') == 11, canonical
          assert data.get('productionCutoverAllowed') is False
          assert data.get('mergeAllowed') is False
          print('SMOKE_ASSERT_PASS: preview contract structure')
          PY

          fetch 'profile deep link' "$PREVIEW_URL/profile" /tmp/profile.html
          expect_marker 'profile SPA shell' /tmp/profile.html 'MANUS-VISUAL-MASTER-05'

          fetch 'lesson deep link' "$PREVIEW_URL/lesson/math.number.place-value.base10.age6-8.l1" /tmp/lesson.html
          expect_marker 'lesson SPA shell' /tmp/lesson.html 'MANUS-VISUAL-MASTER-05'

          fetch 'canonical lesson asset' "$PREVIEW_URL/data/lessons-1.js" /tmp/lessons.js
          expect_marker 'lesson data payload' /tmp/lessons.js 'KV_LESSONS'

          echo '### Browser-entry smoke gate PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Home candidate marker: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Preview contract structure: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Profile deep link: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Lesson deep link: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical lesson asset: PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment credential status
        if: ${{ env.RAW_CLOUDFLARE_API_TOKEN == '' || env.RAW_CLOUDFLARE_ACCOUNT_ID == '' }}
        shell: bash
        run: |
          echo '### Cloudflare preview deployment not executed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validation passed, but Cloudflare repository credentials are not configured.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production DNS or Cloudflare project was changed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preview safety summary
        if: always()
        shell: bash
        run: |
          echo '### KirthiVerse controlled preview' >> "$GITHUB_STEP_SUMMARY"
          echo '- Branch: design/manus-visual-master' >> "$GITHUB_STEP_SUMMARY"
          echo '- Candidate: MANUS-VISUAL-MASTER-05' >> "$GITHUB_STEP_SUMMARY"
          echo '- Navigation: centralized delegated SPA controller' >> "$GITHUB_STEP_SUMMARY"
          echo '- Render lifecycle: observer-free router events' >> "$GITHUB_STEP_SUMMARY"
          echo '- Worker target: kirthiverse-hitech' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production custom-domain configuration: unchanged by this workflow' >> "$GITHUB_STEP_SUMMARY"
          echo '- Paid Cloudflare services: none enabled' >> "$GITHUB_STEP_SUMMARY"
