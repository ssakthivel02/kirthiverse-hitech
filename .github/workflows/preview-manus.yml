name: KirthiVerse Manus Preview
on:
  push:
    branches: [design/manus-visual-master]
  workflow_dispatch:
concurrency:
  group: kirthiverse-manus-preview-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual candidate
        uses: actions/checkout@v4

      - name: Validate lean browser runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          h=Path('index.html').read_text(); p=json.loads(Path('visual-preview.json').read_text()); r=json.loads(Path('preview-runtime.json').read_text())
          assert 'CORE-RUNTIME-V30' in h and '/core-runtime-v30.js?v=CORE-RUNTIME-V30' in h
          assert 'visual-preview-gate.js' not in h and Path('visual-preview-gate.js').is_file()
          assert r['diagnostics']['browserLoaded'] is False and r['diagnostics']['ciOnly'] is True
          assert p['runtimeConsolidation']['browserJsRequestCeiling']==6
          assert p['runtimeConsolidation']['measuredCombinedBytesCeiling']==168000
          assert p['browserQa']['desktopViewport']=='1440x900'
          assert p['browserQa']['mobileViewport']=='390x844'
          assert p['browserQa']['routeMatrix']==['/','/worlds','/world/mathematics','/search','/progress','/profile','/lesson/math.number.place-value.base10.age6-8.l1']
          assert p['canonical']=={'lessons':135,'assessments':72,'worlds':11}
          assert p['mergeAllowed'] is True and p['productionCutoverAllowed'] is False
          assert p.get('ownerVisualApproval',{}).get('status')=='approved'
          assert p.get('guide',{}).get('name')=='Kiki'
          core=Path('core-runtime-v30.js').read_text(); sw=Path('sw-v30.js').read_text()
          for m in ['KV_CORE_RUNTIME','KV_FOCUS_RUNTIME','focusSession:true','profileGoalAware:true']: assert m in core
          assert 'kirthiverse-preview-v30' in sw
          contamination=['__manus__','manus-storage','vite-plugin-manus-runtime','BUILT_IN_FORGE','artifacts.cloudflare.net','ManusDialog']
          loaded=['app.js','core-runtime-v30.js','learning-foundation-v19.js','learning-tools-v20.js','visual-controller-v27.js','learner-adaptive-v26.js']
          assert not any(x in '\n'.join(Path(f).read_text() for f in loaded) for x in contamination)
          print('Lean runtime + owner-approved source-promotion contract PASS.')
          PY

      - name: Measure runtime payload and request count
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          h=Path('index.html').read_text(); refs=re.findall(r'(?:href|src)=["\'](/[^"\']+\.(?:css|js)(?:\?[^"\']*)?)["\']',h); a=[]
          for ref in refs:
            p=ref.split('?',1)[0].lstrip('/')
            if not p.startswith('data/') and p not in a:a.append(p)
          css=sum(Path(p).stat().st_size for p in a if p.endswith('.css')); js=sum(Path(p).stat().st_size for p in a if p.endswith('.js')); total=css+js
          scripts=sum(p.endswith('.js') for p in a); styles=sum(p.endswith('.css') for p in a)
          assert scripts<=6, f'JS request regression: {scripts}'
          assert total<=168000, f'payload regression: {total}'
          print(f'PAYLOAD_CSS_BYTES={css}\nPAYLOAD_JS_BYTES={js}\nPAYLOAD_COMBINED_BYTES={total}\nJS_REQUESTS={scripts}\nCSS_REQUESTS={styles}')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(f'### Lean runtime footprint\n- CSS: {css:,} bytes\n- JS: {js:,} bytes\n- Combined: {total:,} bytes\n- JS requests: {scripts}\n- CSS requests: {styles}\n')
          PY

      - name: Confirm Worker target
        run: |
          grep -q '"name": "kirthiverse-hitech"' wrangler.jsonc
          grep -q '"directory": "."' wrangler.jsonc

      - name: Verify preview validation has no publishing authority
        shell: bash
        run: |
          python - <<'PYGUARD'
          from pathlib import Path
          s=Path('.github/workflows/preview-manus.yml').read_text()
          forbidden=('wrangler'+'@4 deploy','secrets.'+'CLOUDFLARE_API_TOKEN','secrets.'+'CLOUDFLARE_ACCOUNT_ID','https://'+'kirthiverse-hitech.ssakthivel02.workers.dev')
          assert not any(x in s for x in forbidden), 'Preview validation must not publish or access production credentials/URL'
          print('KV_PREVIEW_NO_PUBLISH_PASS')
          PYGUARD

      - name: Preview validation summary
        if: always()
        run: |
          echo '### KirthiVerse preview source validation only' >> "$GITHUB_STEP_SUMMARY"
          echo '- No Cloudflare credentials accessed or Worker publication attempted' >> "$GITHUB_STEP_SUMMARY"
          echo '- This workflow does not perform deployed browser or functional QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- Use the separate Cross-Browser Release QA results for browser coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '- Legacy design-branch definitions may still publish: keep this workflow disabled until every enabled ref is reviewed' >> "$GITHUB_STEP_SUMMARY"
