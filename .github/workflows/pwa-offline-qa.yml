name: KirthiVerse PWA Offline QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pwa-offline-qa.yml'
      - 'ACTIVE_MASTER_CONTROL.json'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw-v30.js'
      - 'core-runtime-v30.js'
      - 'app.js'
      - 'styles.css'
      - 'learning-foundation-v19.css'
      - 'learning-tools-v20.css'
      - 'visual-master-v15.css'
      - 'visual-master-pages-v15.css'
      - 'visual-master-features-v15.css'
      - 'p0-v1.css'
      - 'educator-pilot-v1.css'
      - 'pilot-metrics-v1.css'
      - 'pilot-readiness-v1.css'
      - 'pilot-run-v1.css'
      - 'learning-foundation-v19.js'
      - 'learning-tools-v20.js'
      - 'visual-controller-v27.js'
      - 'learner-adaptive-v26.js'
      - 'mastery-engine-v1.js'
      - 'parent-v1.js'
      - 'diagnostic-v1.js'
      - 'speedlab-v1.js'
      - 'lesson-check-v1.js'
      - 'p0-entry-v1.js'
      - 'educator-pilot-v1.js'
      - 'pilot-metrics-v1.js'
      - 'pilot-readiness-v1.js'
      - 'pilot-run-v1.js'
      - 'visual-preview-gate.js'
      - 'data/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa-offline-qa.yml'
      - 'ACTIVE_MASTER_CONTROL.json'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw-v30.js'
      - 'core-runtime-v30.js'
      - 'app.js'
      - 'styles.css'
      - 'learning-foundation-v19.css'
      - 'learning-tools-v20.css'
      - 'visual-master-v15.css'
      - 'visual-master-pages-v15.css'
      - 'visual-master-features-v15.css'
      - 'p0-v1.css'
      - 'educator-pilot-v1.css'
      - 'pilot-metrics-v1.css'
      - 'pilot-readiness-v1.css'
      - 'pilot-run-v1.css'
      - 'learning-foundation-v19.js'
      - 'learning-tools-v20.js'
      - 'visual-controller-v27.js'
      - 'learner-adaptive-v26.js'
      - 'mastery-engine-v1.js'
      - 'parent-v1.js'
      - 'diagnostic-v1.js'
      - 'speedlab-v1.js'
      - 'lesson-check-v1.js'
      - 'p0-entry-v1.js'
      - 'educator-pilot-v1.js'
      - 'pilot-metrics-v1.js'
      - 'pilot-readiness-v1.js'
      - 'pilot-run-v1.js'
      - 'visual-preview-gate.js'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kirthiverse-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_URL: http://127.0.0.1:8765
  EXPECTED_CACHE: kirthiverse-preview-v35

jobs:
  pwa-offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup pinned Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Confirm HI-TECH ACTIVE MASTER candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c = JSON.parse(fs.readFileSync('ACTIVE_MASTER_CONTROL.json', 'utf8'));
          if (c.status !== 'HI-TECH — ACTIVE MASTER') throw new Error('Not HI-TECH ACTIVE MASTER');
          if (c.canonicalRepository !== process.env.GITHUB_REPOSITORY) throw new Error('Canonical repository mismatch');
          if (c.activeBranch !== 'main') throw new Error('Active branch must remain main');
          if (process.env.GITHUB_BASE_REF && process.env.GITHUB_BASE_REF !== 'main') throw new Error('PR must target main');
          console.log('PWA_ACTIVE_MASTER_PASS');
          NODE
      - name: Validate current PWA and precache contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          m=json.loads(Path('manifest.webmanifest').read_text())
          sw=Path('sw-v30.js').read_text()
          core=Path('core-runtime-v30.js').read_text()
          assert m['start_url']=='/' and m['scope']=='/' and m['display']=='standalone'
          assert m['name'].startswith('KirthiVerse') and m['icons']
          assert "CACHE='kirthiverse-preview-v35'" in sw, 'current v35 cache contract missing'
          assert "VERSION='MANUS-VISUAL-MASTER-05-PWA-35'" in sw, 'current PWA version missing'
          block=re.search(r"PRECACHE=\[(.*?)\];self\.addEventListener\('install'", sw, re.S)
          assert block, 'PRECACHE block not found'
          paths=re.findall(r"'(/[^']*)'", block.group(1))
          assert paths, 'PRECACHE is empty'
          required=[
            '/index.html','/core-runtime-v30.js','/p0-entry-v1.js','/educator-pilot-v1.js',
            '/pilot-metrics-v1.js','/pilot-readiness-v1.js','/pilot-run-v1.js',
            '/data/lessons-1.js','/data/assessments-1.js',
            '/data/class6-math-pilot.js','/data/class6-math-assessments.js',
            '/data/class6-science-pilot.js','/data/class6-science-assessments.js',
            '/data/class6-science-ch2.js','/data/class6-science-ch2-assessments.js'
          ]
          for marker in required: assert marker in paths, f'current precache asset missing: {marker}'
          missing=[]
          for url in paths:
            target=Path('index.html') if url=='/' else Path(url.lstrip('/'))
            if not target.is_file(): missing.append(url)
          assert not missing, f'PRECACHE references missing repository files: {missing}'
          for marker in ["navigator.serviceWorker.register(SW", "updateViaCache:'none'", 'offlineCapable']: assert marker in core, marker
          print(f'PWA_CONTRACT_PASS: manifest + v35 cache + {len(paths)} verified precache paths + bootstrap')
          PY
      - name: Browser cached-origin fallback and direct navigation
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kv-http.log 2>&1 &
          spid=$!
          trap 'kill "${spid:-}" 2>/dev/null || true; kill "${cpid:-}" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 20); do if curl -fsS "$LOCAL_URL/index.html" -o /tmp/kv-pwa-index.html && grep -Fq 'CORE-RUNTIME-V30' /tmp/kv-pwa-index.html; then ready=1; break; fi; sleep 1; done
          if [ "$ready" != 1 ]; then cat /tmp/kv-http.log || true; exit 1; fi
          rm -rf /tmp/kv-pwa
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9333 --user-data-dir=/tmp/kv-pwa "$LOCAL_URL/?pwa=$(date +%s)" >/tmp/kv-pwa.log 2>&1 &
          cpid=$!
          debug=0
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:9333/json/list >/tmp/kv-pwa-pages.json; then debug=1; break; fi; sleep 1; done
          if [ "$debug" != 1 ]; then cat /tmp/kv-pwa.log || true; exit 1; fi
          export SPID="$spid"
          node <<'NODE'
          const {execFileSync}=await import('node:child_process');
          const base=process.env.LOCAL_URL, cacheName=process.env.EXPECTED_CACHE, lesson='math.number.place-value.base10.age6-8.l1';
          const pages=await fetch('http://127.0.0.1:9333/json/list').then(r=>r.json()),page=pages.find(x=>x.type==='page');
          if(!page)throw Error('No Chromium page target');
          const ws=new WebSocket(page.webSocketDebuggerUrl);await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=bad});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.bad(Error(m.error.message)):p.ok(m.result)}};
          const send=(method,params={})=>new Promise((ok,bad)=>{const id=++seq;pending.set(id,{ok,bad});ws.send(JSON.stringify({id,method,params}))});
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');
          const ev=async expression=>{const r=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.text||'Runtime evaluation failed');return r.result?.value};
          const wait=async(expression,label,timeout=20000)=>{const end=Date.now()+timeout;while(Date.now()<end){try{if(await ev(expression))return true}catch{}await new Promise(r=>setTimeout(r,300))}throw Error('Timeout: '+label)};
          await wait(`'serviceWorker' in navigator && !!window.KV_PWA`,'PWA bootstrap');
          await ev(`navigator.serviceWorker.register('/sw-v30.js',{updateViaCache:'none'}).then(()=>navigator.serviceWorker.ready).then(()=>true)`);
          const cacheOk=await ev(`caches.keys().then(k=>k.includes(${JSON.stringify(cacheName)}))`);if(!cacheOk)throw Error('current cache not installed: '+cacheName);
          const required=['/core-runtime-v30.js','/p0-entry-v1.js','/educator-pilot-v1.js','/pilot-metrics-v1.js','/pilot-readiness-v1.js','/pilot-run-v1.js','/data/lessons-1.js','/data/assessments-1.js','/data/class6-math-pilot.js','/data/class6-math-assessments.js','/data/class6-science-pilot.js','/data/class6-science-assessments.js','/data/class6-science-ch2.js','/data/class6-science-ch2-assessments.js'];
          const missing=await ev(`caches.open(${JSON.stringify(cacheName)}).then(async c=>{const req=${JSON.stringify(required)};const out=[];for(const u of req){if(!(await c.match(u)))out.push(u)}return out})`);
          if(missing.length)throw Error('required current assets absent from cache: '+missing.join(', '));
          await send('Page.navigate',{url:base+'/?controlled=1'});await new Promise(r=>setTimeout(r,1600));
          await wait(`document.readyState!=='loading'&&!!document.querySelector('main')`,'controlled online navigation');
          await wait(`!!navigator.serviceWorker.controller`,'service worker control',20000);
          execFileSync('kill',[process.env.SPID]);
          await new Promise(r=>setTimeout(r,500));
          await ev(`window.KV_NAVIGATION.navigate('/lesson/'+${JSON.stringify(lesson)});true`);
          await wait(`location.pathname.startsWith('/lesson/')&&!!document.querySelector('main')&&!!document.getElementById('complete')`,'origin-unavailable SPA lesson',12000);
          await send('Page.navigate',{url:base+'/lesson/'+lesson});await new Promise(r=>setTimeout(r,2200));
          await wait(`document.readyState!=='loading'&&location.pathname.startsWith('/lesson/')&&!!document.querySelector('main')&&!!document.getElementById('complete')`,'origin-unavailable direct lesson navigation',20000);
          if(!(await ev(`window.KV_CORE_RUNTIME?.pwaBootstrap===true`)))throw Error('core runtime missing from cache');
          const dataCached=await ev(`fetch('/data/lessons-1.js').then(r=>r.ok).catch(()=>false)`);if(!dataCached)throw Error('canonical lesson data unavailable from cache');
          const curriculumCached=await ev(`Promise.all(['/data/class6-math-pilot.js','/data/class6-math-assessments.js','/data/class6-science-pilot.js','/data/class6-science-assessments.js','/data/class6-science-ch2.js','/data/class6-science-ch2-assessments.js'].map(u=>fetch(u).then(r=>r.ok).catch(()=>false))).then(x=>x.every(Boolean))`);if(!curriculumCached)throw Error('Class 6 curriculum data unavailable from cache');
          console.log('PWA_PASS: service worker installed and controlling page');
          console.log('PWA_PASS: current v35 cache contains core + Mathematics + Science Chapters 1-2 assets');
          console.log('PWA_PASS: SPA lesson works with origin unavailable');
          console.log('PWA_PASS: direct canonical lesson navigation works with origin unavailable');
          console.log('PWA_PASS: canonical and controlled Class 6 curriculum data served from cache');
          ws.close();
          NODE
      - name: PWA closure summary
        if: always()
        run: |
          echo '### PWA / offline QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- HI-TECH ACTIVE MASTER identity checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Pinned Node 22 QA runtime' >> "$GITHUB_STEP_SUMMARY"
          echo '- Manifest contract checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Current v35 cache and every repository precache path checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Class 6 Mathematics + Science Chapters 1-2 curriculum assets checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Service worker install/control checked in Chromium localhost secure context' >> "$GITHUB_STEP_SUMMARY"
          echo '- SPA and direct canonical lesson navigation checked with origin unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical + controlled Class 6 curriculum cache fallback checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- This is controlled localhost PWA evidence, not production-domain offline certification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production DNS/deployment: unchanged' >> "$GITHUB_STEP_SUMMARY"
