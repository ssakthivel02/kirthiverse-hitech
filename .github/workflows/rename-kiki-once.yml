name: One-time Kiki guide rename

on:
  push:
    branches: [design/manus-visual-master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-guide:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: design/manus-visual-master
          fetch-depth: 0

      - name: Rename Kiri to Kiki everywhere in tracked product text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          self_path=Path('.github/workflows/rename-kiki-once.yml')
          files = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          changed=[]
          for raw in files:
              if not raw:
                  continue
              p=Path(raw.decode())
              if p == self_path:
                  continue
              try:
                  data=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              new=data.replace('Kiri','Kiki').replace('கிறி','கிகி')
              if new != data:
                  p.write_text(new,encoding='utf-8')
                  changed.append(str(p))
          print('Changed files:')
          for p in changed:
              print(' -',p)
          PY

      - name: Enforce Kiki-only product branding
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -e 'Kiri' -e 'கிறி' -- ':!data/**' ':!.github/workflows/rename-kiki-once.yml'; then
            echo 'Legacy Kiri branding remains in product/runtime files.'
            exit 1
          fi
          grep -q "name:'Kiki'" index.html
          grep -q "I’m Kiki, your KirthiVerse guide" index.html
          grep -q 'Kiki · Animated Teacher' index.html
          grep -q 'நான் கிகி' index.html
          echo 'KIKI_BRANDING_PASS'

      - name: Commit rename if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(guide): rename Kiri to Kiki everywhere'
          git push origin HEAD:design/manus-visual-master
