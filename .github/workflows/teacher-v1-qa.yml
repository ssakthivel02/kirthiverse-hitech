name: KirthiVerse Animated Teacher v1 QA
on:
  push:
    branches: [design/manus-visual-master]
    paths:
      - '.github/workflows/teacher-v1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  LOCAL_URL: http://127.0.0.1:8767
jobs:
  teacher-v1-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
      - name: Validate teacher contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          for marker in ['data-kv-teacher-runtime="v1"','data-kv-teacher-style="v1"','KV_TEACHER_RUNTIME','name:\'Kiri\'','localOnly:true','voice:false','camera:false','tracking:false','childCloudProfile:false','prefers-reduced-motion:reduce']:
            assert marker in h, marker
          for state in ['welcome','explain','encourage','question','success','retry']:
            assert state in h, state
          teacher=h.split('data-kv-teacher-runtime="v1"',1)[1]
          assert 'fetch(' not in teacher and 'XMLHttpRequest' not in teacher
          print('TEACHER_CONTRACT_PASS: original local-only Kiri runtime + six teaching states + reduced motion')
          PY
      - name: Chromium teacher interaction QA
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/kv-teacher-http.log 2>&1 &
          spid=$!
          trap 'kill "$spid" 2>/dev/null || true; kill "${cpid:-}" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS "$LOCAL_URL/index.html" >/tmp/kv-teacher-index.html && break || sleep 1; done
          grep -Fq 'data-kv-teacher-runtime="v1"' /tmp/kv-teacher-index.html
          rm -rf /tmp/kv-teacher-profile
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9555 --user-data-dir=/tmp/kv-teacher-profile "$LOCAL_URL/lesson/math.number.place-value.base10.age6-8.l1" >/tmp/kv-teacher-chrome.log 2>&1 &
          cpid=$!
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:9555/json/list >/tmp/kv-teacher-pages.json && break || sleep 1; done
          node <<'NODE'
          const pages=await fetch('http://127.0.0.1:9555/json/list').then(r=>r.json()),page=pages.find(x=>x.type==='page');if(!page)throw Error('No Chromium page target');
          const ws=new WebSocket(page.webSocketDebuggerUrl);await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=bad});let seq=0,pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.bad(Error(m.error.message)):p.ok(m.result)}};const send=(method,params={})=>new Promise((ok,bad)=>{const id=++seq;pending.set(id,{ok,bad});ws.send(JSON.stringify({id,method,params}))});await send('Runtime.enable');
          const ev=async x=>{const r=await send('Runtime.evaluate',{expression:x,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.text||'Runtime eval failed');return r.result?.value};const wait=async(x,label)=>{const end=Date.now()+15000;while(Date.now()<end){try{if(await ev(x))return}catch{}await new Promise(r=>setTimeout(r,250))}throw Error('Timeout: '+label)};
          await wait(`!!window.KV_TEACHER_RUNTIME&&!!document.querySelector('[data-teacher="v1"]')`,'teacher render');
          if(await ev(`document.querySelectorAll('[data-teacher="v1"]').length`)!==1)throw Error('Duplicate teacher');
          if(!(await ev(`document.querySelector('[data-teacher="v1"] details')===null&&document.querySelector('[data-teacher="v1"]')?.tagName==='DETAILS'`)))throw Error('Teacher not collapsible details');
          const before=await ev(`document.querySelector('[data-teacher-state]').textContent`);await ev(`document.querySelector('[data-teacher-next]').click();true`);const after=await ev(`document.querySelector('[data-teacher-state]').textContent`);if(before===after)throw Error('Teacher prompt did not advance');
          await ev(`document.querySelector('[data-teacher-motion]').click();true`);if(!(await ev(`document.querySelector('[data-teacher="v1"]').classList.contains('kt-static')`)))throw Error('Motion toggle failed');
          if(!(await ev(`JSON.parse(localStorage.getItem('kirthiverse.hitech.teacher.v1')).motion===false`)))throw Error('Motion preference not persisted');
          await ev(`document.querySelector('[data-teacher="v1"]').open=false;true`);await new Promise(r=>setTimeout(r,100));if(!(await ev(`JSON.parse(localStorage.getItem('kirthiverse.hitech.teacher.v1')).open===false`)))throw Error('Collapse preference not persisted');
          if(!(await ev(`document.querySelector('[data-teacher-message]').getAttribute('role')==='status'`)))throw Error('Teacher live status missing');
          console.log('TEACHER_PASS: Kiri renders once on canonical lesson');console.log('TEACHER_PASS: teaching prompt advances');console.log('TEACHER_PASS: motion toggle + local persistence');console.log('TEACHER_PASS: accessible collapse + live status');ws.close();
          NODE
      - name: Teacher v1 summary
        if: always()
        run: |
          echo '### Animated Teacher v1 QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- Original CSS/DOM Kiri character; no third-party avatar asset' >> "$GITHUB_STEP_SUMMARY"
          echo '- Six English-ready states: welcome, explain, encourage, question, success, retry' >> "$GITHUB_STEP_SUMMARY"
          echo '- Accessible collapse and live status' >> "$GITHUB_STEP_SUMMARY"
          echo '- Motion on/off persisted locally; reduced-motion supported' >> "$GITHUB_STEP_SUMMARY"
          echo '- No voice, camera, tracking, remote child profile or paid avatar service in v1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tamil/English teacher state layer remains next planned stage' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production DNS: unchanged' >> "$GITHUB_STEP_SUMMARY"
